<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste JS</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding:40px;">
  <h1 id="titulo">Se o botão funcionar, o JS está OK</h1>
  <button id="btnTeste" style="font-size:20px; padding:14px 28px;">Clique aqui</button>
  <p id="resultado" style="font-size:18px; margin-top:20px;"></p>

  <script>
    document.getElementById('btnTeste').addEventListener('click', function(){
      document.getElementById('resultado').textContent = '✅ JavaScript funcionando! Cliques: ' + (window._n = (window._n||0)+1);
      document.getElementById('titulo').style.color = 'green';
    });
  </script>
</body>
</html>
