<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Técnico</title>
<style>
  :root{
    --navy:#0B2A55;
    --navy-2:#0f3567;
    --yellow:#FFC20E;
    --blue:#00A0DC;
    --green:#6CC24A;
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#dfe3ea;
    --label-bg:#eef1f5;
    --text:#1c2430;
    --muted:#6b7480;
    --arrow-fill:#FF3333;
    --arrow-stroke:#A4171A;
    --danger:#c23a3a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11151b;
      --card:#1a1f27;
      --border:#2c3341;
      --label-bg:#232a35;
      --text:#e8ecf1;
      --muted:#9aa4b2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#11151b;
    --card:#1a1f27;
    --border:#2c3341;
    --label-bg:#232a35;
    --text:#e8ecf1;
    --muted:#9aa4b2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .logo{ height:34px; width:auto; display:block; }
  .accent-bar{
    height:6px;
    width:100%;
    margin:10px 0 18px;
    border-radius:4px;
    background: linear-gradient(90deg, var(--blue), var(--green) 33%, var(--yellow) 66%, var(--navy) 100%);
    opacity:0.9;
  }
  h1.title{
    color:var(--navy);
    font-size:26px;
    margin:0 0 14px;
  }
  .banner{
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:6px;
    display:block;
    margin-bottom:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:18px;
  }
  .section-head h2{
    margin:0 0 4px;
    color:var(--navy);
    font-size:19px;
  }
  h2{ color:var(--navy); font-size:19px; margin:0 0 12px; }
  .hint{
    color:var(--muted);
    font-size:13px;
    display:block;
    margin-bottom:12px;
  }
  .fields{ padding:0; overflow:hidden; }
  .field-row{
    display:grid;
    grid-template-columns: 160px 1fr;
    border-bottom:1px solid var(--border);
  }
  .field-row:last-child{ border-bottom:none; }
  .field-row label{
    background:var(--label-bg);
    color:var(--navy);
    font-weight:bold;
    font-size:12.5px;
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    padding:10px 12px;
  }
  .field-row input{
    border:none;
    background:transparent;
    color:var(--text);
    font-size:15px;
    padding:10px 12px;
    width:100%;
    outline:none;
  }
  .field-row input:focus{ background:var(--label-bg); }
  @media (max-width:480px){
    .field-row{ grid-template-columns: 1fr; }
    .field-row label{ padding-bottom:4px; }
  }
  textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    background:var(--bg);
    resize:vertical;
    margin-bottom:14px;
  }
  .comment-label{
    display:block;
    color:var(--navy);
    font-weight:bold;
    font-size:12.5px;
    margin-bottom:6px;
  }
  .row-buttons{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-secondary{ background:var(--label-bg); color:var(--navy); border:1px solid var(--border); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--border); }
  .btn-sm{ padding:7px 10px; font-size:13px; border-radius:6px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-arrow.active{ background:var(--arrow-fill); color:#fff; }
  .btn-lg{ padding:13px 20px; font-size:15.5px; }
  .status{ color:var(--muted); font-size:13px; }
  #data-photo-preview img.thumb{
    max-width:220px;
    max-height:220px;
    display:block;
    margin-top:12px;
    border-radius:8px;
    border:1px solid var(--border);
  }
  .photo-block{
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .photo-block:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .photo-frame{
    position:relative;
    width:100%;
    line-height:0;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#000;
  }
  .photo-frame img{
    width:100%;
    height:auto;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
  }
  .photo-frame svg.overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:crosshair;
  }
  .photo-toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .tag{
    font-size:12px;
    color:var(--muted);
    background:var(--label-bg);
    padding:4px 8px;
    border-radius:6px;
  }
  .final-actions{ margin-top:6px; }
  #generate-status{ margin-top:8px; }
  footer.note{
    color:var(--muted);
    font-size:12px;
    text-align:center;
    margin-top:10px;
  }
</style>
</head>
