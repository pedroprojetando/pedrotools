<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problemas · Assistente do Técnico Gráfico</title>
<style>
  :root{
    --bg: #232526;
    --bg-deep: #1a1b1c;
    --panel: #2d2f31;
    --panel-hover: #383b3d;
    --text: #ffffff;
    --text-dim: #a8adb0;
    --accent: #e0a13c;
    --accent-dim: #8a6a2c;
    --line: #3c3f41;
    --danger: #d9695f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background: var(--bg-deep);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    min-height:100vh;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding: 22px 20px 16px 20px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back-btn{
    background:none;
    border: 1px solid var(--line);
    color: var(--text);
    width:38px; height:38px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .back-btn:active{ background: var(--panel-hover); }
  .back-btn.hidden{ visibility:hidden; }
  .titles{ display:flex; flex-direction:column; line-height:1.25; }
  .crumb{
    font-size:12px;
    color: var(--text-dim);
    letter-spacing:.02em;
  }
  .screen-title{
    font-size:20px;
    font-weight:600;
    color: var(--text);
  }
  main{
    flex:1;
    padding: 20px;
  }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .tile{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 14px;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    text-align:center;
    cursor:pointer;
    min-height: 96px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background .12s ease, transform .08s ease;
  }
  .tile:active{
    background: var(--panel-hover);
    transform: scale(.97);
  }
  .tile.disabled{
    color: var(--text-dim);
    cursor:default;
    opacity:.55;
  }
  .tile.disabled:active{ transform:none; background:var(--panel); }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* Calculadora */
  .field{
    margin-bottom: 18px;
  }
  .field label{
    display:block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .seg{
    display:flex;
    gap:8px;
  }
  .seg button{
    flex:1;
    padding: 12px 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    font-size: 14px;
    cursor:pointer;
  }
  .seg button.selected{
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }
  input[type="number"], input[type="text"]{
    width:100%;
    padding: 13px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    font-size: 16px;
  }
  input[type="number"]:focus, input[type="text"]:focus{
    outline: none;
    border-color: var(--accent);
  }
  .result-box{
    margin-top: 26px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-align:center;
  }
  .result-label{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .result-value{
    font-size: 40px;
    font-weight: 700;
    color: var(--accent);
    line-height:1.1;
  }
  .result-sub{
    margin-top:6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .warn{
    color: var(--danger);
    font-weight:600;
  }
  .hint{
    margin-top: 22px;
    font-size: 12px;
    color: var(--text-dim);
    line-height:1.5;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  /* Chat do Pedro */
  #screen-pedro main, section[data-screen="pedro"]{
    height: 100%;
  }
  .chat-wrap{
    display:flex;
    flex-direction:column;
    height: calc(100vh - 78px);
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    padding: 4px 4px 12px 4px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .msg{
    max-width: 85%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user{
    align-self: flex-end;
    background: var(--accent-dim);
    color: var(--text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant{
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.system-note{
    align-self: center;
    color: var(--text-dim);
    font-size: 12px;
    background:none;
    border:none;
    text-align:center;
  }
  .msg.thinking{
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-style: italic;
  }
  .chat-input-row{
    display:flex;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .chat-input-row textarea{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: 15px;
    font-family: inherit;
    max-height: 100px;
  }
  .chat-input-row textarea:focus{
    outline:none;
    border-color: var(--accent);
  }
  .send-btn{
    background: var(--accent);
    color: #1a1b1c;
    border:none;
    border-radius: 12px;
    width: 48px;
    font-size: 18px;
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:active{ transform: scale(.94); }
  .send-btn:disabled{
    background: var(--panel-hover);
    color: var(--text-dim);
  }
  .chat-tag{
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    padding-bottom: 6px;
  }

  /* Manchas */
  select{
    width:100%;
    padding: 13px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 9px;
    font-size: 15px;
    appearance: none;
    -webkit-appearance:none;
  }
  select:focus{ outline:none; border-color: var(--accent); }

  .causa-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }
  .causa-card .causa-mm{
    font-size: 12px;
    color: var(--accent);
    font-weight:700;
    margin-bottom: 4px;
  }
  .causa-card .causa-texto{
    font-size: 14.5px;
    line-height:1.4;
  }
  .causa-card .causa-obs{
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .sem-resultado{
    text-align:center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px 10px;
  }

  /* Solvente */
  .antes-depois{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }
  .ad-col{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  .ad-title{
    font-size: 13px;
    font-weight:700;
    color: var(--accent);
    text-align:center;
    margin-bottom: 12px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .ad-col .field{ margin-bottom: 12px; }
  .ad-col .field:last-child{ margin-bottom:0; }
  .ad-col label{ font-size:11px; margin-bottom:5px; }
  .ad-col input[type="number"]{
    padding: 10px 10px;
    font-size: 15px;
  }
  .totals-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .totals-box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align:center;
  }
  .totals-label{
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .totals-value{
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  /* Botão da tabela de compensação (IPA) */
  .ipa-topbar{
    display:flex;
    justify-content:flex-end;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tabela-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--accent);
    font-size: 12px;
    font-weight:600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor:pointer;
  }
  .tabela-btn:active{ background: var(--panel-hover); }

  /* Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(0,0,0,.6);
    z-index: 50;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.active{ display:flex; }
  .modal-box{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    display:flex;
    flex-direction:column;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
    font-weight:700;
  }
  .modal-close{
    background:none;
    border:none;
    color: var(--text-dim);
    font-size: 18px;
    cursor:pointer;
    padding: 2px 6px;
  }
  .modal-body{
    overflow:auto;
    padding: 12px 14px 20px 14px;
  }
  .tech-table{
    border-collapse: collapse;
    width: 100%;
    font-size: 11.5px;
    white-space: nowrap;
  }
  .tech-table th, .tech-table td{
    border: 1px solid var(--line);
    padding: 5px 6px;
    text-align:center;
  }
  .tech-table thead th{
    background: var(--panel);
    color: var(--accent);
    position: sticky;
    top: 0;
  }
  .tech-table td.pct-col{
    background: var(--panel);
    font-weight:700;
    color: var(--text);
    position: sticky;
    left: 0;
  }
  .tech-table .dens-group{
    background: var(--panel-hover);
    color: var(--text);
  }

  /* Tinta */
  .gear-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--accent);
    width: 40px;
    height: 40px;
    border-radius: 9px;
    font-size: 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .gear-btn:active{ background: var(--panel-hover); }
  .folha-wrap{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
    text-align:center;
  }
  .folha-svg-area{
    display:flex;
    justify-content:center;
    padding: 6px 0 2px 0;
  }
  .folha-area-txt{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .folha-area-txt strong{ color: var(--accent); }
  .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .row2 .field{ margin-bottom:0; }
  .cobertura-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cobertura-item label{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display:block;
  }
  .cobertura-item .pct-wrap{
    position:relative;
  }
  .cobertura-item .pct-wrap span{
    position:absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--text-dim);
    pointer-events:none;
  }
  .cobertura-item input{
    padding-right: 30px;
  }
  .consumo-table, .custo-table{
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    margin-top: 10px;
  }
  .consumo-table th, .custo-table th{
    text-align:left;
    color: var(--accent);
    font-size: 11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }
  .consumo-table td, .custo-table td{
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
  }
  .consumo-table tr:last-child td, .custo-table tr:last-child td{ border-bottom:none; }
  .custo-table tfoot td{
    font-weight:700;
    color: var(--accent);
    border-top: 2px solid var(--line);
    border-bottom:none;
    padding-top: 12px;
  }
  .section-title{
    font-size: 14px;
    font-weight:700;
    color: var(--text);
    margin: 22px 0 4px 0;
  }
  .settings-substrato-row{
    display:flex;
    gap: 10px;
    align-items:flex-end;
  }
  .settings-substrato-row .field{ flex:1; margin-bottom:0; }
  .btn-secondary{
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 9px;
    padding: 13px 16px;
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-secondary:active{ background: var(--panel-hover); }
  .btn-block{
    width:100%;
    margin-top: 12px;
  }
  .ink-config-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .ink-config-row{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .ink-config-row:last-child{ margin-bottom:0; }
  .ink-config-row .field{ margin-bottom:0; }
  .ink-config-row label{ font-size:11px; margin-bottom:5px; }
  .ink-config-row input{ padding: 10px 10px; font-size:14px; }
  .auto-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    cursor:pointer;
    user-select:none;
  }
  .auto-badge input{ width:auto; }
  .auto-badge.is-auto{ color: var(--accent); }
  .swatch{
    display:inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.35);
    margin-right: 6px;
    vertical-align: middle;
    flex-shrink:0;
  }
  .cobertura-item label{ display:flex; align-items:center; }
  .consumo-table td:first-child, .custo-table td:first-child{
    display:flex;
    align-items:center;
  }

  a.tile, a.back-btn{ text-decoration:none; }
  a.tile:visited, a.back-btn:visited{ color: var(--text); }

</style>

</head>

  <header>
    <a class="back-btn" href="index.html" aria-label="Voltar">‹</a>
    <div class="titles">

</div>

  const OFFSET_NOTAS = {
  '1': 'Adicionar Verniz ou Branco Transparente',
  '2': 'Adicionar Amaciante',
  '3': 'Adicionar Verniz Mordente ou Antivelatura',
  '4': 'Usar Verniz Macio - NÃO USAR PASTA ANTITAK',
  '5': 'Use Secante',
  '6': 'Aplicar Verniz',
  '7': 'Aplicar Branco Transparente',
  '8': 'Imprimir Chapado no Lado Tela do Papel',
  '9': 'Adicione amaciante líquido à base de óleo mineral / mude a sequência / evite usar secante nas 1ª e 2ª cores / use pó de maior granulação / manuseio incorreto',
  '10': 'Faça pilhas pequenas / areje o papel / use tintas mais concentradas / aumente o pó',
  '11': 'Lave e entinte novamente / adicione antipele',
  '12': 'Após acontecer, não há o que fazer / trocar papel / usar pouca tinta / usar tinta menos oxidativa / imprimir lado chapados primeiro / esperar secagem para impressão do outro lado',
  '13': 'Manter o papel embalado / instalar lâmpadas infravermelhas na entrada. Ambiente ideal: 25°C e 50% de umidade relativa / aumentar a pressão da escova ou o fluxo de ar que sustenta a folha'
};

  // ---------- PROBLEMAS (Offset: causa x efeito) ----------
  const probModoSeg = document.getElementById('probModoSeg');
  const probSelect = document.getElementById('probSelect');
  const probSelectLabel = document.getElementById('probSelectLabel');
  const probResultados = document.getElementById('probResultados');

  let probModo = 'porProblema';

  function popularSelectProblemas(){
    probSelect.innerHTML = '<option value="">Selecione...</option>';
    if(probModo === 'porProblema'){
      probSelectLabel.textContent = 'Selecione o problema';
      const nomes = OFFSET_PROBLEMAS.map(p => p.n).sort((a,b) => a.localeCompare(b, 'pt-BR'));
      nomes.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        probSelect.appendChild(opt);
      });
    } else {
      probSelectLabel.textContent = 'Selecione a causa';
      const nomes = OFFSET_CAUSAS.map((n,i) => ({n,i})).sort((a,b) => a.n.localeCompare(b.n, 'pt-BR'));
      nomes.forEach(({n,i}) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = n;
        probSelect.appendChild(opt);
      });
    }
    probResultados.innerHTML = '';
  }

  function extrairNotas(nomeProblema){
    const nums = [...nomeProblema.matchAll(/\((\d+)\)/g)].map(m => m[1]);
    return nums.filter(n => OFFSET_NOTAS[n]).map(n => ({ num: n, texto: OFFSET_NOTAS[n] }));
  }

  function renderProblemas(){
    probResultados.innerHTML = '';
    const val = probSelect.value;
    if(!val) return;

    if(probModo === 'porProblema'){
      const problema = OFFSET_PROBLEMAS.find(p => p.n === val);
      if(!problema) return;

      if(problema.c.length === 0){
        probResultados.innerHTML = '<div class="sem-resultado">Nenhuma causa catalogada para este problema.</div>';
      } else {
        problema.c.forEach(ci => {
          const card = document.createElement('div');
          card.className = 'causa-card';
          card.innerHTML = '<div class="causa-texto">' + OFFSET_CAUSAS[ci] + '</div>';
          probResultados.appendChild(card);
        });
      }

      const notas = extrairNotas(problema.n);
      if(notas.length > 0){
        const notaBox = document.createElement('div');
        notaBox.className = 'hint';
        notaBox.style.marginTop = '18px';
        notaBox.innerHTML = '<strong>Soluções sugeridas:</strong><br>' +
          notas.map(nt => '(' + nt.num + ') ' + nt.texto).join('<br><br>');
        probResultados.appendChild(notaBox);
      }

    } else {
      const causaIdx = parseInt(val);
      const problemasComEssaCausa = OFFSET_PROBLEMAS.filter(p => p.c.includes(causaIdx));

      if(problemasComEssaCausa.length === 0){
        probResultados.innerHTML = '<div class="sem-resultado">Nenhum problema catalogado para esta causa.</div>';
        return;
      }

      problemasComEssaCausa.forEach(p => {
        const card = document.createElement('div');
        card.className = 'causa-card';
        const notas = extrairNotas(p.n);
        card.innerHTML = '<div class="causa-texto">' + p.n + '</div>' +
          (notas.length > 0 ? '<div class="causa-obs">Solução: ' + notas.map(nt=>nt.texto).join(' · ') + '</div>' : '');
        probResultados.appendChild(card);
      });
    }
  }

  probModoSeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      probModoSeg.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      probModo = btn.dataset.val;
      popularSelectProblemas();
    });
  });
  probModoSeg.querySelector('button').classList.add('selected');

  probSelect.addEventListener('change', renderProblemas);

  popularSelectProblemas();

</script>
