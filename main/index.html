<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BraghinApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a2c30;
    --tile:#363940;
    --tile-hover:#3f434b;
    --line:#4a4e57;
    --text:#ffffff;
    --muted:#9aa0aa;
    --c:#00a8e8; --m:#e6007e; --y:#ffd400; --k:#c8ccd2;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0;min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 40px}

  header{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .mark{width:34px;height:34px;flex:none}
  h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1}
  .cmyk{display:flex;height:4px;border-radius:2px;overflow:hidden;margin:0 0 26px}
  .cmyk span{flex:1}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .tile{
    position:relative;aspect-ratio:1/1;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:18px;border-radius:18px;
    background:var(--tile);
    border:1px solid var(--line);
    color:var(--text);text-decoration:none;
    overflow:hidden;
    transition:background .18s ease, transform .18s ease, border-color .18s ease;
  }
  .tile::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);
  }
  .tile svg{width:42px;height:42px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tile .name{font-size:1.08rem;font-weight:700;line-height:1.2}
  .tile:hover{background:var(--tile-hover);border-color:var(--accent);transform:translateY(-2px)}
  .tile:active{transform:scale(.98)}
  .tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  .c{--accent:var(--c)} .m{--accent:var(--m)} .y{--accent:var(--y)} .k{--accent:var(--k)}

  @media (min-width:520px){ .tile .name{font-size:1.2rem} .tile svg{width:48px;height:48px} }
  @media (prefers-reduced-motion:reduce){ .tile{transition:none} .tile:hover{transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="10" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="17" y1="1" x2="17" y2="33" stroke="#fff" stroke-width="2"/>
      <line x1="1" y1="17" x2="33" y2="17" stroke="#fff" stroke-width="2"/>
    </svg>
    <h1>BraghinApps</h1>
  </header>
  <div class="cmyk" aria-hidden="true">
    <span style="background:var(--c)"></span><span style="background:var(--m)"></span><span style="background:var(--y)"></span><span style="background:var(--k)"></span>
  </div>

  <nav class="grid">
    <a class="tile c" href="https://pbraghin.com.br/IPA" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path d="M24 5C24 5 11 20 11 30a13 13 0 0 0 26 0C37 20 24 5 24 5z"/><line x1="19" y1="35" x2="29" y2="25"/><circle cx="19.5" cy="26" r="1.6"/><circle cx="28.5" cy="34" r="1.6"/></svg>
      <span class="name">Compensação IPA</span>
    </a>
    <a class="tile m" href="https://pbraghin.com.br/ManchasFind" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><rect x="6" y="8" width="36" height="32" rx="3"/><path d="M20 20c3-4 9-3 10 1s-1 7-5 7-8-4-5-8z"/><circle cx="33" cy="31" r="2"/><circle cx="14" cy="30" r="1.4"/></svg>
      <span class="name">Manchas</span>
    </a>
    <a class="tile y" href="https://pbraghin.com.br/ProblemasFind" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path d="M24 6 44 40H4z"/><line x1="24" y1="18" x2="24" y2="29"/><circle cx="24" cy="34.5" r="1.2"/></svg>
      <span class="name">Problemas</span>
    </a>
    <a class="tile k" href="https://pbraghin.com.br/ConsumoSolvente" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path d="M14 14h20l2 6v20a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V20z"/><path d="M19 14V8h10v6"/><path d="M12 22h24"/><path d="M24 27c0 0-4 4.5-4 7a4 4 0 0 0 8 0c0-2.5-4-7-4-7z"/></svg>
      <span class="name">Consumo Solvente</span>
    </a>
    <a class="tile c" href="https://pbraghin.com.br/ConsumoTinta" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path d="M10 16h28v22a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z"/><ellipse cx="24" cy="16" rx="14" ry="4"/><path d="M18 16c0 5 6 5 6 10s6 4 6 0"/></svg>
      <span class="name">Consumo Tinta</span>
    </a>
    <a class="tile m" href="https://pbraghin.com.br/ConsumoVerniz" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path d="M6 30 24 40l18-10"/><path d="M6 22 24 32l18-10L24 12z"/><path d="M29 19l4-2"/><path d="M33 22l3-1.5"/></svg>
      <span class="name">Consumo Verniz</span>
    </a>
    <a class="tile y" href="https://code.pbraghin.com.br" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><circle cx="21" cy="21" r="12"/><line x1="30" y1="30" x2="42" y2="42"/><polyline points="14,24 18,19 22,23 27,16"/></svg>
      <span class="name">Estação de Análise</span>
    </a>
    <a class="tile k" href="https://pbraghin.com.br/sth/" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><rect x="6" y="6" width="15" height="15" rx="2"/><rect x="27" y="6" width="15" height="15" rx="2"/><rect x="6" y="27" width="15" height="15" rx="2"/><rect x="27" y="27" width="15" height="15" rx="2"/></svg>
      <span class="name">STH</span>
    </a>
  </nav>
</div>
</body>
</html>
