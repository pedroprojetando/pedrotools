<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esquemas de rolaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #DCE3E8; --ink: #13304D; --ink-soft: #4B6177; --panel: #FFFFFF; --line: #B9C6D1;
    --safety: #F2C230; --safety-ink: #2A2100;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3; --panel: #172838; --line: #2C4257; }
  }
  :root[data-theme="dark"] { --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3; --panel: #172838; --line: #2C4257; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Barlow", "Segoe UI", Roboto, Arial, sans-serif; }
  header.top { padding: 18px 20px 14px; border-bottom: 3px solid var(--ink); }
  h1 { margin: 0; font: 700 1.9rem/1.05 "Barlow Condensed", "Arial Narrow", sans-serif; }
  .lead { margin: 6px 0 0; color: var(--ink-soft); max-width: 60ch; line-height: 1.45; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .card { text-align: left; font: inherit; color: var(--ink); background: var(--panel); cursor: pointer;
    border: 2px solid var(--line); border-radius: 6px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px;
    position: relative; overflow: hidden; min-height: 170px; }
  .card:hover { border-color: var(--ink); }
  .card:focus-visible { outline: 3px solid var(--safety); outline-offset: 3px; }
  .card .num { font: 700 3.2rem/0.95 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: -.01em; }
  .card .fam { font-weight: 600; font-size: 1.05rem; }
  .card .models { color: var(--ink-soft); line-height: 1.4; font-size: .95rem; }
  .card .status { margin-top: auto; padding-top: 10px; font: 600 .95rem "Barlow Condensed", "Arial Narrow", sans-serif; display: flex; align-items: center; gap: 8px; }
  .card .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
  .card.ready .status::before { background: var(--safety); border-color: var(--safety); }
  .card.empty { cursor: default; border-style: dashed; }
  .card.empty .num { color: var(--ink-soft); }
  .card .rollers { position: absolute; right: -20px; bottom: -20px; width: 104px; height: 104px; opacity: .9; pointer-events: none; }
  .card > span { position: relative; z-index: 1; }
  .card .status { padding-right: 76px; }
  .back { font: 600 1rem "Barlow Condensed", "Arial Narrow", sans-serif; padding: 9px 16px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; }
  .back:focus-visible { outline: 3px solid var(--safety); outline-offset: 3px; }
  .famhead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 18px; }
  .famhead h2 { margin: 0; font: 700 1.7rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; }
  .note { margin: 18px 0 0; padding: 12px; border-left: 4px solid var(--safety);
    background: color-mix(in srgb, var(--safety) 12%, transparent); line-height: 1.45; max-width: 70ch; }
  #viewer { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 5;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .vbar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 2px solid var(--ink); flex: none; }
  .vbar .crumb { color: var(--ink-soft); font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbar .crumb strong { color: var(--ink); }
  #frame { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
</style>
</head>
<body>
<div id="home">
  <header class="top">
    <h1>Esquemas de rolaria</h1>
    <p class="lead">Heidelberg · escolha a família de máquinas para abrir o esquema interativo de rolos, movimentos e análise de manchas.</p>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div id="familyView" hidden>
  <main>
    <div class="famhead"><button class="back" data-go="">← Famílias</button><h2 id="famTitle"></h2></div>
    <div class="grid" id="machGrid"></div>
    <p class="note" id="famNote" hidden></p>
  </main>
</div>
<div id="viewer" hidden>
  <div class="vbar"><button class="back" id="vBack">← Voltar</button><span class="crumb" id="crumb"></span></div>
  <iframe id="frame" title="Esquema de rolaria"></iframe>
</div>
<script id="src-tpl" type="text/plain">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esquema de rolaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #DCE3E8;
    --ink: #13304D;
    --ink-soft: #4B6177;
    --sheet: #F8FAFB;
    --panel: #FFFFFF;
    --line: #B9C6D1;
    --safety: #F2C230;
    --safety-ink: #2A2100;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3;
      --sheet: #E7ECF0; --panel: #172838; --line: #2C4257;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3;
    --sheet: #E7ECF0; --panel: #172838; --line: #2C4257;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px; border-bottom: 3px solid var(--ink);
  }
  h1 {
    margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 1.6rem; letter-spacing: .01em; flex: 1 1 auto;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: 600 1rem "Barlow Condensed", "Arial Narrow", sans-serif;
    padding: 9px 16px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button[aria-pressed="true"] { background: var(--safety); color: var(--safety-ink); border-color: var(--safety); }
  button:focus-visible { outline: 3px solid var(--safety); outline-offset: 3px; }
  .roller:focus { outline: none; }
  .roller:focus-visible .sel { opacity: .6; }
  button svg { width: 18px; height: 18px; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--ink-soft); }
  .speed input { accent-color: var(--safety); width: 110px; }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto;
  }
  .sheet {
    background: var(--sheet); border: 2px solid var(--ink); border-radius: 6px;
    padding: 8px; min-width: 0;
  }
  #diagram { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); }
  body.manchas #diagram { max-height: none; }
  .roller { cursor: pointer; }
  .jogbar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
    position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 2;
  }
  .jogbar button {
    justify-content: center; padding: 14px 10px; font-size: 1.15rem;
    background: #13304D; color: #FFFFFF; border-color: #13304D;
    box-shadow: 0 2px 0 #081827;
  }
  .jogbar button[aria-pressed="true"] { background: #F2C230; color: #2A2100; border-color: #B8900F; box-shadow: none; transform: translateY(2px); }
  .roller .hl { stroke-width: 0; }
  .roller.flash .hl { animation: flash 1s ease-in-out; }
  @keyframes flash { 0% { stroke-width: 0; } 25%, 75% { stroke-width: 10; } 100% { stroke-width: 0; } }
  .mark .halo { display: none; }
  .mark.shared .halo { display: inline; transform-box: fill-box; transform-origin: center; animation: pulse 1.1s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
  .multi { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.5; }
  .multi strong { display: block; font-size: .95rem; color: var(--ink-soft); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { .mark.shared .halo { animation: none; } }
  .hold { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .modes { display: none; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%;
    padding-top: 10px; border-top: 1px dashed var(--line); }
  .modes.open { display: flex; }
  .modes span { color: var(--ink-soft); font-size: .95rem; margin-right: 4px; }
  .modes button { min-width: 64px; justify-content: center; }
  .modes .varinfo { flex-basis: 100%; grid-column: 1 / -1; max-width: none; margin: 4px 0 0; line-height: 1.45; }
  .modes .varinfo strong { color: var(--ink); }
  .modes button.opt { border-style: dashed; grid-column: 1 / -1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
  button[aria-pressed="true"] .dot { background: currentColor; }
  #diagram.hide-info .info { display: none; }
  .sep { width: 2px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .roller .sel { opacity: 0; transition: opacity .15s; }
  .roller.active .sel { opacity: 1; }

  aside {
    background: var(--panel); border: 2px solid var(--line); border-radius: 6px;
    padding: 20px; align-self: start; position: sticky; top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .empty { color: var(--ink-soft); line-height: 1.5; margin: 0; }
  .tag {
    font: 700 3.4rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 4px;
  }
  .kind { color: var(--ink-soft); margin: 0 0 18px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; }
  dt { color: var(--ink-soft); font-size: .95rem; }
  dd { margin: 0; font-weight: 600; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .note {
    margin: 18px 0 0; padding: 12px; border-left: 4px solid var(--safety);
    background: color-mix(in srgb, var(--safety) 12%, transparent); line-height: 1.45; font-size: .95rem;
  }

  .leftcol { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .diag { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 20px; }
  .diag h2 { font: 700 1.6rem/1.1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 6px; }
  .diag h3 { font: 600 1.15rem "Barlow Condensed", "Arial Narrow", sans-serif; margin: 22px 0 8px; }
  .hint { color: var(--ink-soft); line-height: 1.45; margin: 0 0 14px; max-width: 70ch; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .fields label { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; color: var(--ink-soft); }
  .fields input {
    font: 600 1.2rem "Barlow", Arial, sans-serif; color: var(--ink); background: transparent;
    border: 2px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%;
  }
  .fields input:focus-visible { outline: 3px solid var(--safety); outline-offset: 1px; border-color: var(--ink); }
  details { margin-bottom: 14px; }
  summary { cursor: pointer; color: var(--ink-soft); margin-bottom: 12px; }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); padding: 12px 22px; font-size: 1.1rem; }
  .summary { margin: 18px 0 0; line-height: 1.5; }
  .causes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .cause {
    width: 100%; display: grid; grid-template-columns: 5.2rem 1fr auto; gap: 14px; align-items: start;
    text-align: left; font: inherit; color: var(--ink); background: transparent;
    border: 2px solid var(--line); border-radius: 4px; padding: 12px;
  }
  .cause.exact { border-color: var(--safety); }
  .cause .val { font: 700 1.5rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; }
  .cause .val small { display: block; font: 500 .8rem "Barlow", Arial, sans-serif; color: var(--ink-soft); margin-top: 4px; }
  .cause strong { display: block; font-size: 1.05rem; }
  .cause .why { display: block; margin-top: 2px; }
  .cause .calc { display: block; margin-top: 4px; color: var(--ink-soft); font-size: .92rem; }
  .cause .kind { display: inline-block; margin-top: 6px; font-size: .82rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-soft); }
  .cause .diff { font-weight: 700; white-space: nowrap; justify-self: start; }
  .cause > span { display: block; min-width: 0; }
  .cause.exact .diff { color: var(--ink); background: var(--safety); color: var(--safety-ink); padding: 2px 8px; border-radius: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .gaptable { margin-top: 18px; }
  .tablewrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 4px; }
  .gaptable table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: .95rem; }
  .gaptable th, .gaptable td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .gaptable th { font: 600 1rem "Barlow Condensed", "Arial Narrow", sans-serif; background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .gaptable td strong { display: block; }
  .gaptable td small { color: var(--ink-soft); }
  .gaptable .hit { color: #C0261B; font-weight: 700; }
  .gaptable .hit.green { color: #0E9F3E; }
  .gaptable h3 + .tablewrap { margin-top: 0; }
  .gaptable button { padding: 6px 10px; font-size: .9rem; white-space: nowrap; }
  .impact-pulse { transform-box: fill-box; transform-origin: center; animation: impact 1.2s ease-out forwards; }
  @keyframes impact { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
  .marklist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .marklist li { display: grid; grid-template-columns: 14px 5.5rem 1fr; gap: 10px; align-items: baseline; line-height: 1.35; }
  .marklist .sw { width: 14px; height: 6px; border-radius: 2px; align-self: center; }
  .overlap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 6px; }
  .overlap button { padding: 7px 12px; font-size: .95rem; }
  .overlap button:disabled { opacity: .45; cursor: default; }
  .sheetmap { margin-top: 22px; padding-top: 6px; border-top: 1px solid var(--line); }
  .sheetmap svg { margin: 6px 0 10px; max-width: 760px; }
  .err { color: #C0261B; font-weight: 600; margin: 14px 0 0; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
    .cause { grid-template-columns: 4.4rem 1fr; }
    .cause .diff { grid-column: 2; }
    .diag { padding: 16px; }
    aside { position: static; }
    #diagram { max-height: none; }
    header { padding: 12px; }
    h1 { font-size: 1.35rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 6px; }
    .controls button { justify-content: center; padding: 8px 6px; font-size: .95rem; }
    .sep { display: none; }
    .speed { grid-column: span 2; }
    .modes.open { display: grid; grid-template-columns: repeat(4, 1fr); }
    .modes span { grid-column: span 4; }
    .speed input { flex: 1; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Esquema de rolaria</h1>
  <div class="controls">
    <button id="fwd" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      Girar para frente
    </button>
    <button id="back" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
      Girar para trás
    </button>
    <button id="stop">Parar</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="ink" aria-pressed="true"><span class="dot"></span>Entintadores</button>
    <button id="water" aria-pressed="true"><span class="dot"></span>Molha</button>
    <button id="tom" aria-pressed="true"><span class="dot"></span>Tomador</button>
    <button id="zw" aria-pressed="true"><span class="dot"></span><span id="zwLabel">Intermediário</span></button>
    <button id="varBtn" aria-expanded="false" aria-controls="variants">Variações <span id="varOut"></span></button>
    <button id="stripe" aria-pressed="false"><span class="dot"></span>Modo faixa</button>
    <button id="manchas" aria-pressed="false"><span class="dot"></span>Manchas</button>
    <button id="info" aria-pressed="true">Mostrar informações</button>
    <label class="speed">Velocidade <input id="speed" type="range" min="60" max="700" value="320"></label>
  </div>
  <div class="modes" id="variants" role="group" aria-label="Variações da família 102">
    <span>Variação:</span>
  </div>
</header>

<main>
  <div class="leftcol">
  <div class="sheet">
    <svg id="diagram" class="hide-info" viewBox="0 0 800 800" role="img" aria-label="Esquema de rolos numerados"></svg>
    <div class="jogbar">
      <button id="jogF" class="hold" aria-pressed="false" title="Segure para girar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3.2"><path d="M4 12a8 8 0 1 0 2.4-5.7"/></svg>
      Picote para frente
      </button>
      <button id="jogB" class="hold" aria-pressed="false" title="Segure para girar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 3.2"><path d="M20 12a8 8 0 1 1-2.4-5.7"/></svg>
      Picote para trás
      </button>
    </div>
  </div>
  <section class="diag" id="diag" hidden aria-labelledby="diagTitle">
    <h2 id="diagTitle">Análise de manchas</h2>
    <p class="hint">Informe as medidas a partir da borda frontal da folha. O cálculo usa os diâmetros do esquema e os contatos na posição atual da máquina (entintadores, molha e intermediário).</p>
    <div class="fields">
      <label>Comprimento da folha (mm)<input id="fLen" type="text" inputmode="decimal" value="720"></label>
      <label>Altura da mancha (mm)<input id="fPos" type="text" inputmode="decimal" placeholder="ex.: 588"></label>
      <label>Vario do molhador (%)<input id="fVario" type="text" inputmode="decimal" value="0"></label>
      <label>Distância entre faixas repetidas (mm)<input id="fRep" type="text" inputmode="decimal" placeholder="opcional"></label>
    </div>
    <details>
      <summary>Bordas da imagem e da chapa</summary>
      <div class="fields">
        <label>Início do contato com a chapa (mm)<input id="fC1" type="text" inputmode="decimal" value="10"></label>
        <label>Borda frontal da imagem (mm)<input id="fImgF" type="text" inputmode="decimal" value="10"></label>
        <label>Borda traseira da imagem (mm)<input id="fImgR" type="text" inputmode="decimal" placeholder="automático"></label>
        <label>Fim do contato com a chapa (mm)<input id="fC4" type="text" inputmode="decimal" value="723,2"></label>
        <label>Formato máximo da máquina (mm)<input id="fFmax" type="text" inputmode="decimal" value="720"></label>
        <label>Registro circunferencial (mm)<input id="fReg" type="text" inputmode="decimal" value="0"></label>
      </div>
      <p class="hint" id="stdHint"></p>
    </details>
    <div class="actions">
      <button id="diagBtn" class="primary">Diagnosticar</button>
      <button id="tableBtn" aria-expanded="false" aria-controls="gapTable">Tabela</button>
    </div>
    <div id="gapTable" class="gaptable" hidden></div>
    <div id="diagOut" aria-live="polite"></div>
    <div id="sheetMap" class="sheetmap"></div>

const feedLine = el("polyline", { fill: "none", stroke: "#111", "stroke-width": 2.5 }, svg);
{ // linhas de entrada tangentes ao ductor

// Contato entre rolos selecionados: linha entre as duas marcas do par, com o nome do par
const pairLayer = el("g", { "pointer-events": "none" }, svg);
let pairs = [];
function markPos(m) {
  const a = m.ang + m.owner.angle * Math.PI / 180;
  return { x: m.owner.x + Math.cos(a) * m.rr, y: m.owner.y + Math.sin(a) * m.rr };
}
// Par destacado: os dois rolos selecionados, ou um contato com o cilindro de chapa
// em que qualquer um dos lados esteja selecionado
function pairShown(m) {
  const a = picked.has(m.owner), b = picked.has(m.partner);
  const plate = m.owner.id === "chapa" || m.partner.id === "chapa";
  return (a && b) || (plate && (a || b));
}
function updateStripeVisibility() {
  stripeDots.forEach(m => {
    const shown = picked.size > 0 && pairShown(m);
    m.style.display = picked.size === 0 || picked.has(m.owner) || shown ? "" : "none";
    m.classList.toggle("shared", shown);
  });
  pairLayer.replaceChildren(); pairs = [];
  stripeDots.forEach(m => {
    if (!pairShown(m) || rollers.indexOf(m.owner) > rollers.indexOf(m.partner)) return;
    const other = stripeDots.find(n => n.owner === m.partner && n.partner === m.owner);
    const line = el("line", { stroke: "#FF8A00", "stroke-width": 3, "stroke-dasharray": "6 4", "stroke-linecap": "round" }, pairLayer);
    const lab = el("g", {}, pairLayer);
    const short = o => o.id === "chapa" ? "Chapa" : (o.name || o.id);
    const name = `${short(m.owner)}–${short(m.partner)}`;
    const w = name.length * 8.4 + 14;
    el("rect", { x: -w / 2, y: -12, width: w, height: 24, rx: 4, fill: "#FF8A00" }, lab);
    const t = el("text", { "text-anchor": "middle", "dominant-baseline": "central", fill: "#1d1200",
      "font-family": "Barlow, Arial, sans-serif", "font-weight": 700, "font-size": 14 }, lab);
    t.textContent = name;
    pairs.push({ a: m, b: other, line, lab });
  });
  renderPairs();
}
function renderPairs() {
  pairs.forEach(p => {
    const A = markPos(p.a), B = markPos(p.b);
    p.line.setAttribute("x1", A.x); p.line.setAttribute("y1", A.y);
    p.line.setAttribute("x2", B.x); p.line.setAttribute("y2", B.y);
    // etiqueta afastada do ponto médio, para fora dos dois rolos
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const cx = (p.a.owner.x + p.b.owner.x) / 2, cy = (p.a.owner.y + p.b.owner.y) / 2;
    let dx = mx - cx, dy = my - cy, L = Math.hypot(dx, dy);
    if (L < 1) { dx = -(p.b.owner.y - p.a.owner.y); dy = p.b.owner.x - p.a.owner.x; L = Math.hypot(dx, dy); }
    p.lab.setAttribute("transform", `translate(${(mx + dx / L * 26).toFixed(1)} ${(my + dy / L * 26).toFixed(1)})`);
  });
}

function render() {
  rollers.forEach(o => {
    o.el.setAttribute("transform", `translate(${o.x.toFixed(2)} ${o.y.toFixed(2)})`);
    o.rot.setAttribute("transform", `rotate(${o.angle.toFixed(2)})`);

const CYCLE = AT_A + TRAVEL + AT_DUCTOR + TRAVEL;

  if (p < AT_A) return 0;
  if (p < AT_A + TRAVEL) return ease((p - AT_A) / TRAVEL);
  if (p < AT_A + TRAVEL + AT_DUCTOR) return 1;
  return 1 - ease((p - AT_A - TRAVEL - AT_DUCTOR) / TRAVEL);
}

/* ---------- Animação ---------- */
const approach = (v, target, step) => v < target ? Math.min(target, v + step) : Math.max(target, v - step);
let last = performance.now();
function tick(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  // encostar/desencostar leva cerca de 0,4 s
  inkT = approach(inkT, inkOn ? 0 : 1, dt / 0.4);
  waterT = approach(waterT, waterOn ? 0 : 1, dt / 0.4);
  zwT = approach(zwT, zwOn ? 0 : 1, dt / 0.4);

  const d = effDir();
  if (d !== 0) {
    const base = Number(speed.value); // graus/s de um rolo de raio 50
    rollers.forEach(o => {
      // mesma velocidade de superfície: rolos menores giram mais rápido
      if (!o.follow) o.angle = (o.angle - d * base * (50 / o.r) * dt) % 360;
    });
    rollers.forEach(o => { if (o.follow) o.angle = o.follow * R.chapa.angle; });
    plateRevs += base * (50 / R.chapa.r) * dt / 360;
  }
  tomS = approach(tomS, tomOn ? tomadorPos(plateRevs - tomRev0) : 0, dt / 0.25);
  layout(inkT, waterT, tomS, zwT);
  watchContacts();
  trackImpacts();
  render();
  updatePanel();
  requestAnimationFrame(tick);
}
/* ---------- Análise de manchas ---------- */

//   A1 = início blanqueta × contra-pressão, E1 = fim blanqueta × contra-pressão,
//   A2 = início chapa × blanqueta,          E2 = fim chapa × blanqueta
// Regras da Tabela de manchas: descarga = E1 − (formato máximo − formato atual);
// A2 e E2 variam com o registro circunferencial.
const GAP_STREAKS = [
  { code: "A1", mm: 519, text: "Início blanqueta × contra-pressão (A1)" },
  { code: "E1", mm: 388, text: "Fim blanqueta × contra-pressão (E1)" },
  { code: "A2", mm: 349, text: "Início chapa × blanqueta (A2)" },
  { code: "E2", mm: 212, text: "Fim chapa × blanqueta (E2)" }
];
// Faixas periódicas: circunferência (π × d) dos rolos que tocam a chapa + engrenagens da variação
function periodicList() {
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  return FORM_ROLLERS.map(id => { const o = R[id], k = o.kind ? o.kind.replace(/ \(.*\)/, "") : "Rolo";
    return { mm: Math.PI * o.d, text: `${cap(k)} (rolo ${LBL(id)}, Ø ${fmt(o.d)})`, roller: id }; })
    .concat(VARIANT.gears || []).concat(masterRep());
}
// distâncias periódicas da Tabela master (engrenagens, distribuidor, vibrador…) que ainda não estão na lista
function masterRep() {
  const base = VARIANT.gears || [], out = [];
  ((VARIANT.master && VARIANT.master.rep) || []).forEach(r => {
    if (/Abertura da pinça/.test(r.t)) return;   // já estão nas listras dinâmicas da variação
    if ([...base, ...out].some(g => Math.abs(g.mm - r.v) < 0.15)) return;
    out.push({ mm: r.v, text: `${r.t} (Tabela master${r.o ? ", " + r.o : ""})` });
  });

}
// linhas da Tabela master de manchas perto da altura medida
function masterHtml(pos) {
  const mt = VARIANT.master; if (!mt || !mt.pos.length) return "";
  const d = r => r.v2 ? (pos < r.v ? r.v - pos : pos > r.v2 ? pos - r.v2 : 0) : Math.abs(pos - r.v);
  const hits = mt.pos.filter(r => d(r) <= TOL + 1e-9).sort((a, b) => d(a) - d(b)).slice(0, 10);
  const head = `<h3>Tabela master de manchas${mt.base ? ` (lista da ${mt.base}, como base)` : ""}</h3>`;
  if (!hits.length) return head + `<p class="hint">Nenhuma linha da tabela entre ${mm(pos - TOL)} e ${mm(pos + TOL)} mm.</p>`;
  return head + `<ol class="causes">${hits.map(r => { const dd = d(r), ex = dd <= 0.5;
    return `<li><div class="cause${ex ? " exact" : ""}"><span class="val">${r.v2 ? `${fmt(r.v)}–${fmt(r.v2)}` : fmt(r.v)}<small>mm</small></span>
      <span><strong>${r.t}</strong>${r.o ? `<span class="why">${r.o}</span>` : ""}<span class="kind">Tabela master · ${r.m}</span></span>
      <span class="diff">${ex ? "exato" : (dd > 0 ? "± " : "") + mm(dd) + " mm"}</span></div></li>`; }).join("")}</ol>
    <p class="hint">Valores de referência medidos em máquina (sem registro circunferencial). “Entintador 1–4” segue a ordem da tabela: 1º a 4º entintador a partir da molha.</p>`;
}
function gapStreaks(P) {
  const fmax = isNaN(P.fmax) ? VARIANT.fmax : P.fmax, reg = P.reg || 0;
  const out = GAP_STREAKS.map(g => {
    let v = g.mm, calc = `Valor Heidelberg: ${g.mm} mm`;
    if ((g.code === "A2" || g.code === "E2") && reg) {
      v = g.mm + reg;
      calc = `Heidelberg: ${g.mm} mm ${reg > 0 ? "+" : "−"} ${mm(Math.abs(reg))} mm de registro circunferencial = ${mm(v)} mm`;
    }
    return g.mm == null ? { ...g, v: NaN, calc: "Sem valor na tabela Heidelberg", hidden: true } : { ...g, v, calc };
  });

  const e1 = GAP_STREAKS.find(g => g.code === "E1").mm;
  if (e1 == null) return out;
  const L = P.L > 0 ? P.L : fmax;
  if (L !== fmax) out.push({ code: "Descarga", mm: e1, v: e1 - (fmax - L), text: "Descarga: fim do papel no contato blanqueta × contra-pressão",
    calc: `Descarga: ${e1} − (${mm(fmax)} − ${mm(L)}) = ${mm(e1 - (fmax - L))} mm` });
  else out.push({ code: "Descarga", mm: e1, v: e1, text: "Descarga: fim do papel no contato blanqueta × contra-pressão",
    calc: `No formato máximo (${mm(fmax)} mm), a descarga coincide com o E1: ${e1} mm`, hidden: true });
  return out;
}

// Posições (mm a partir da borda frontal) onde um rolo de forma marca a folha

  const circTxt = isDamp && P.vario ? `π × ${fmt(o.d)} × ${fmt(1 + P.vario / 100)} = ${mm(circ)} mm` : `π × ${fmt(o.d)} = ${mm(circ)} mm`;
  const front = [], rear = [];
  if (!isNaN(P.c1)) front.push({ at: P.c1, text: "Início do contato com a chapa, na saída da boca (causa 1)", short: "saída da boca" });
  if (!isNaN(P.imgF)) front.push({ at: P.imgF, text: "Borda frontal da imagem (causa 2)", short: "borda frontal da imagem" });
  // Tabela de manchas: rolaria = diâmetro × 3,14, contada da borda frontal sem somar a pinça
  front.push({ at: 0, text: "Circunferência do rolo (π × d), contada da borda frontal sem somar a pinça, como na Tabela de manchas", short: "circunferência π × d", pure: true });
  if (!isNaN(P.imgR)) rear.push({ at: P.imgR, text: "Borda traseira da imagem (causa 3)", short: "borda traseira da imagem" });
  if (!isNaN(P.c4)) rear.push({ at: P.c4, text: "Fim do contato com a chapa, na entrada da boca (causa 4)", short: "entrada da boca" });
  const merge = list => list.reduce((acc, e) => {
    const same = acc.find(x => Math.abs(x.at - e.at) < 0.05);
    if (same) { same.text += " e " + e.text.charAt(0).toLowerCase() + e.text.slice(1); same.short += " e " + e.short; }
    else acc.push({ ...e });
    return acc;
  }, []);
  const out = [];
  merge(front).forEach(e => {
    for (let k = 1; ; k++) {
      const v = e.at + k * circ;
      if (v > P.Ls + limit) break;
      out.push({ v, k, next: false, why: e.text, short: e.short,
        calc: e.pure ? `${k} × ${mm(circ)} = ${mm(v)} mm (circunferência ${circTxt})`
          : `${mm(e.at)} + ${k} × ${mm(circ)} = ${mm(v)} mm (circunferência ${circTxt})` });
    }
  });
  merge(rear).forEach(e => {
    for (let k = 1; k < 40; k++) {
      const v = e.at + k * circ - PLATE_CIRC;
      if (v > P.Ls + limit) break;
      if (v < -limit) continue;
      out.push({ v, k, next: true, why: e.text, short: e.short,
        calc: `${mm(e.at)} + ${k} × ${mm(circ)} − ${mm(PLATE_CIRC)} = ${mm(v)} mm (circunferência ${circTxt})` });
    }
  });
  return out.sort((x, y) => x.v - y.v);
}

// Faixas que se repetem pela folha: compara a distância entre elas com a circunferência dos rolos
function periodicHtml(P) {
  if (!(P.rep > 0)) return "";
  const tol = v => Math.min(TOL, Math.max(1, v * 0.1));
  const list = [...periodicList(), ...(VARIANT.rep || [])].map(p => ({ ...p, d: P.rep - p.mm })).filter(p => Math.abs(p.d) <= tol(p.mm))
    .sort((a, b) => Math.abs(a.d) - Math.abs(b.d));
  TRANSMIT.forEach(id => {
    const c = Math.PI * R[id].d;
    if (Math.abs(P.rep - c) <= TOL) list.push({ mm: c, d: P.rep - c, roller: id, text: `${roleName(R[id])}, impacto transmitido pelo molhador (π × ${fmt(R[id].d)})` });
  });
  const item = p => {
    const ex = Math.abs(p.d) <= 0.5;
    return `<li><button class="cause${ex ? " exact" : ""}" ${p.roller ? `data-roller="${p.roller}"` : ""}>
      <span class="val">${mm(p.mm)}<small>mm</small></span>
      <span><strong>${p.text}</strong><span class="why">Faixas repetidas a cada ${mm(p.mm)} mm</span>
        <span class="kind">${p.roller ? "Circunferência do rolo" : "Engrenagem"}</span></span>
      <span class="diff">${ex ? "exato" : (p.d > 0 ? "+" : "−") + mm(Math.abs(p.d)) + " mm"}</span></button></li>`;
  };
  return `<h3>Faixas repetidas a cada ${mm(P.rep)} mm</h3>` + (list.length
    ? `<ol class="causes">${list.map(item).join("")}</ol>`
    : `<p class="hint">Nenhum rolo que toca a chapa tem esse passo. Referências: ${periodicList().concat(TRANSMIT.map(id => ({ mm: Math.PI * R[id].d, text: roleName(R[id]) }))).map(p => `${p.text.replace(/ \(.*$/, "")} ${mm(p.mm)} mm`).join("; ")}.</p>`);
}

function diagnose() {
  const box = document.getElementById("diagOut");
  const P = readParams(), L = P.L, pos = P.pos;
  const periodic = periodicHtml(P);
  if (!(L > 0) || !(pos >= 0)) {
    box.innerHTML = periodic || `<p class="err">Informe o comprimento da folha e a altura da mancha em mm, ou a distância entre faixas repetidas.</p>`;
    return;
  }
  if (pos > L) {
    box.innerHTML = `<p class="err">A altura da mancha (${mm(pos)} mm) passa do comprimento da folha (${mm(L)} mm).</p>`;
    return;
  }
  const found = [];
  const off = [];
  FORM_ROLLERS.forEach(id => {
    const o = R[id];
    if (!contactsOf(R.chapa).includes(o)) { off.push(roleName(o)); return; }
    streaksFor(o, P, TOL).forEach(m => found.push({ o, v: m.v,
      title: `${roleName(o)}: ${ord(m.k)}${m.next ? ", na folha seguinte" : ""}`, why: m.why, calc: m.calc,
      kind: id === DAMP ? "Molhador na chapa" : "Entintador na chapa", hop: 1 }));
  });
  TRANSMIT.forEach(id => {
    const t = transmittedFor(id, P, TOL);
    if (!t.linked) return;
    t.marks.forEach(m => found.push({ o: R[id], v: m.v,
      title: `${roleName(R[id])}: ${ord(m.k)}${m.next ? ", na folha seguinte" : ""}`, why: m.why, calc: m.calc,
      kind: "Impacto transmitido pelo molhador", hop: 2 }));
  });
  gapStreaks(P).filter(g => !g.hidden).forEach(g => found.push({ o: null, gap: g.code, v: g.v, title: `Listra de boca ${g.code}`, why: g.text,
    calc: g.calc, kind: "Boca dos cilindros", hop: 0 }));
  // listras próprias da variação (tabelas do treinamento): valor fixo ou faixa
  (VARIANT.extra || []).forEach(x => {
    const v = Math.min(x.to, Math.max(x.from, pos));
    found.push({ o: null, v, title: x.title, why: x.text, kind: x.kind, hop: 3,
      calc: x.from === x.to ? `Valor do treinamento: ${mm(x.from)} mm` : `Faixa do treinamento: ${mm(x.from)} a ${mm(x.to)} mm` });
  });

  const hits = found.map(f => ({ ...f, d: f.v - pos }))
    .filter(f => Math.abs(f.d) <= TOL + 1e-9)
    .sort((a, b) => Math.abs(a.d) - Math.abs(b.d) || a.hop - b.hop);
  const exact = hits.filter(h => Math.abs(h.d) <= 0.5), near = hits.filter(h => Math.abs(h.d) > 0.5);

  const item = h => {
    const ex = Math.abs(h.d) <= 0.5;
    const diff = ex ? "exato" : (h.d > 0 ? "+" : "−") + mm(Math.abs(h.d)) + " mm";
    return `<li><button class="cause${ex ? " exact" : ""}" ${h.o ? `data-roller="${h.o.id}"` : h.gap ? `data-gap="${h.gap}"` : ""}>
      <span class="val">${mm(h.v)}<small>mm</small></span>
      <span><strong>${h.title}</strong><span class="why">${h.why}</span>
        <span class="calc">${h.calc}</span><span class="kind">${h.kind}</span></span>
      <span class="diff">${diff}</span></button></li>`;
  };
  const rollersHit = [...new Set(hits.filter(h => h.o).map(h => h.o))];
  let html = `<p class="summary">Mancha a <strong>${mm(pos)} mm</strong> da borda frontal, numa folha de ${mm(L)} mm. Faixa analisada: ${mm(pos - TOL)} a ${mm(pos + TOL)} mm. `;
  html += hits.length ? `${hits.length} ${hits.length === 1 ? "causa possível" : "causas possíveis"}${rollersHit.length ? `, envolvendo ${rollersHit.length} ${rollersHit.length === 1 ? "rolo" : "rolos"} (destacados no esquema)` : ""}. Toque numa causa para ver o rolo.</p>`
    : `Nenhuma causa calculada nessa faixa.</p><p class="hint">Confira a medida a partir da borda frontal, o comprimento da folha e as posições de Entintadores, Molha e Intermediário. Também vale conferir o Vario do molhador e as bordas da imagem.</p>`;
  if (off.length) html += `<p class="hint">Fora da análise por estarem afastados da chapa agora: ${off.join(", ")}.</p>`;
  html += periodic;
  const masterBlock = masterHtml(pos);
  if (exact.length) html += `<h3>Valor exato</h3><ol class="causes">${exact.map(item).join("")}</ol>`;
  if (near.length) html += `<h3>Até ${TOL} mm de diferença</h3><ol class="causes">${near.map(item).join("")}</ol>`;
  html += masterBlock;
  html += `<p class="note">Se a listra continua com a rolaria bem ajustada, a Heidelberg indica retícula auxiliar geométrica (círculos ou losangos com 40 a 50 % de cobertura) na borda frontal, entre a borda do papel e o início da impressão e passando além do início da imagem. Com margem, repita na borda traseira. Fora do formato também funciona, mas suja o cilindro de impressão.</p>`;
  box.innerHTML = html;

  box.querySelectorAll("[data-roller]").forEach(b => b.addEventListener("click", () => {
    const o = R[b.dataset.roller];
    if (selected !== o) select(o); else drawSheet(o);
    flash([o.id]);
  }));
  box.querySelectorAll("[data-gap]").forEach(b => b.addEventListener("click", () => {
    flash(["chapa", "blanqueta", "impressao"]);
    drawSheet(null, b.dataset.gap);
  }));
  flash(rollersHit.map(o => o.id));
  drawSheet(selected);
}
/* Folha com as marcas do rolo selecionado */
/* Impacto transmitido: quando o molhador bate na entrada ou saída da boca da chapa,
   o choque passa para os rolos que encostam nele. A marca fica nesses rolos, volta ao
   contato com o molhador a cada giro deles e percorre o molhador até a chapa. */
const TRANSMIT = M.transmit;
const TSHORT = Object.fromEntries(TRANSMIT.map(id => [id, shortName(id)]));
const TLIST = () => joinE(TRANSMIT.map(id => "ao " + TSHORT[id]));
const GREEN = "#0E9F3E", GREEN_TXT = "#0A6E2B";
// percurso na superfície do 16, do contato com o rolo x até o contato com a chapa.
// O 16 rola contra a chapa: com a chapa girando para frente (anti-horário), ele gira no sentido horário.
function arcOn14(x) {
  const w = R[DAMP], a = mod(deg(w, R.chapa) - deg(w, x), 360);
  return a / 360 * Math.PI * w.d;
}
function transmittedFor(xId, P, limit = 0) {
  const x = R[xId], w = R[DAMP];
  const linked = contactsOf(w).includes(x) && contactsOf(R.chapa).includes(w);
  const circ = Math.PI * x.d, arc = arcOn14(x);
  const out = [];
  const evs = [
    { at: P.c1, rear: false, short: "impacto do molhador na saída da boca", code: "saída",
      text: "Impacto do molhador na saída da boca da chapa, transmitido ao " + TSHORT[xId] },
    { at: P.c4, rear: true, short: "impacto do molhador na entrada da boca", code: "entrada",
      text: "Impacto do molhador na entrada da boca da chapa, transmitido ao " + TSHORT[xId] }
  ];
  evs.forEach(e => {
    if (isNaN(e.at)) return;
    for (let k = 1; k < 40; k++) {
      const v = e.at + arc + k * circ - (e.rear ? PLATE_CIRC : 0);
      if (v > P.Ls + limit) break;
      if (v < -limit) continue;
      out.push({ v, k, next: e.rear, why: e.text, short: e.short, code: e.code,
        calc: `${mm(e.at)} + ${mm(arc)} (percurso no ${LBL(DAMP)}) + ${k} × ${mm(circ)}${e.rear ? ` − ${mm(PLATE_CIRC)}` : ""} = ${mm(v)} mm (circunferência π × ${fmt(x.d)})` });
    }
  });
  return { linked, arc, circ, marks: out.sort((m, n) => m.v - n.v) };
}
const greenMarks = (xId, P) => transmittedFor(xId, P).marks.filter(m => m.v >= 0 && m.v <= P.Ls)
  .map(m => ({ v: m.v, color: "green", label: `${mm(m.v)} mm`,
    sub: `${TSHORT[xId]}, ${ord(m.k)}${m.next ? " (folha seguinte)" : ""}, ${m.short}` }));

/* Folha com as marcas do rolo selecionado */
const sheetState = { layered: false, layer: 0 };
function drawSheet(o, onlyGap) {
  const box = document.getElementById("sheetMap");
  if (!box || !manchasOn) return;
  const P = readParams(), L = P.Ls;
  let marks = [], title, note = "";
  if (o && FORM_ROLLERS.includes(o.id)) {
    title = `Onde o ${roleName(o).replace("Rolo", "rolo")} marca a folha`;
    marks = streaksFor(o, P).filter(m => m.v >= 0 && m.v <= L)
      .map(m => ({ v: m.v, label: `${mm(m.v)} mm`, sub: `${ord(m.k)}${m.next ? " (folha seguinte)" : ""}, ${m.short}` }));
    if (o.id === DAMP) {
      TRANSMIT.forEach(id => { if (transmittedFor(id, P).linked) marks.push(...greenMarks(id, P)); });
      title = `Onde o rolo ${LBL(DAMP)} (molhador) marca a folha, com o impacto transmitido ${TLIST()}`;
    }
    if (!contactsOf(R.chapa).includes(o)) note = "Este rolo está afastado da chapa agora. As marcas mostram onde ele marcaria quando encostado.";
  } else if (o && TRANSMIT.includes(o.id)) {
    const t = transmittedFor(o.id, P);
    title = `Onde o ${roleName(o).replace("Rolo", "rolo")} marca a folha pelo impacto do molhador`;
    marks = greenMarks(o.id, P);
    if (!t.linked) note = `Agora ele não está ligado à chapa pelo molhador ${LBL(DAMP)} (molha desligada ou ${LBL(DAMP)} afastado). As marcas mostram onde ele marcaria com o contato.`;
  } else if (onlyGap || (o && GAP_BY_CYL[o.id])) {
    const codes = onlyGap ? [onlyGap] : GAP_BY_CYL[o.id];
    title = onlyGap ? `Listra de boca ${onlyGap}` : `Listras de boca ligadas ao ${o.name.toLowerCase()}`;
    marks = gapStreaks(P).filter(g => !g.hidden && codes.includes(g.code) && g.v >= 0 && g.v <= L)
      .map(g => ({ v: g.v, label: `${mm(g.v)} mm`, sub: `${g.code}, ${g.text.replace(/ \(.*\)/, "").toLowerCase()}` }));
  } else {
    box.innerHTML = o
      ? `<p class="hint"><strong>${o.name || roleName(o)}</strong> não toca a chapa nem os cilindros, então não marca o impresso diretamente: só transfere tinta ou água para os outros rolos. ${touchList()}.</p>`
      : `<p class="hint">${touchList()} para ver onde ele marca a folha.</p>`;
    return;
  }
  sheetState.layer = 0;
  paintSheet(box, P, title, marks, note);
}

// agrupa faixas que coincidem (a menos de 12 mm uma da outra)
function clusters(marks) {
  const sorted = [...marks].sort((a, b) => a.v - b.v), groups = [];
  sorted.forEach(m => {
    const g = groups[groups.length - 1];
    if (g && m.v - g[g.length - 1].v < 12) g.push(m); else groups.push([m]);
  });
  return groups;
}

function paintSheet(box, P, title, marks, note = "") {
  Object.assign(sheetState, { box, P, title, marks, note });
  const L = P.Ls;
  const groups = clusters(marks), layers = Math.max(1, ...groups.map(g => g.length));
  const hasOverlap = layers > 1;
  if (!hasOverlap) sheetState.layered = false;
  if (sheetState.layer >= layers) sheetState.layer = 0;
  const shown = !sheetState.layered ? marks
    : groups.flatMap(g => g.length === 1 ? g : (g[sheetState.layer] ? [g[sheetState.layer]] : []));

  // desenho em mm: largura ilustrativa do formato máximo da variação
  const W = VARIANT.fw, ML = 30, MR = 30, MT = 70, MB = 70, fs = 26;
  const y = v => MT + (L - v);   // borda frontal embaixo, como nos slides
  let svgs = `<svg viewBox="0 0 ${W + ML + MR} ${L + MT + MB}" role="img" aria-label="${title}" style="width:100%;height:auto;display:block">`;
  svgs += `<rect x="${ML}" y="${MT}" width="${W}" height="${L}" fill="#F2F4F5" stroke="#13304D" stroke-width="3"/>`;
  if (!isNaN(P.imgF) && !isNaN(P.imgR) && P.imgR > P.imgF)
    svgs += `<rect x="${ML + 120}" y="${y(Math.min(P.imgR, L))}" width="${W - 240}" height="${Math.min(P.imgR, L) - P.imgF}" fill="#F7D4D6"/>`;
  if (!isNaN(P.c1) && P.c1 > 0) svgs += `<rect x="${ML}" y="${y(P.c1)}" width="${W}" height="${P.c1}" fill="#D5DBE0"/>`;
  svgs += `<text x="${ML + W / 2}" y="${MT + L + 44}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="${fs}" fill="#4B6177">Borda frontal (0 mm)</text>`;
  svgs += `<text x="${ML + W / 2}" y="${MT - 22}" text-anchor="middle" font-family="Barlow, Arial, sans-serif" font-size="${fs}" fill="#4B6177">Borda traseira (${mm(L)} mm)</text>`;
  if (P.pos >= 0 && P.pos <= L) {
    svgs += `<line x1="${ML}" x2="${ML + W}" y1="${y(P.pos)}" y2="${y(P.pos)}" stroke="#13304D" stroke-width="3" stroke-dasharray="14 8"/>`;
    svgs += `<text x="${ML + W - 12}" y="${y(P.pos) + fs + 6}" text-anchor="end" font-family="Barlow, Arial, sans-serif" font-size="${fs - 4}" fill="#13304D">mancha informada ${mm(P.pos)} mm</text>`;
  }
  // barras; o valor em mm fica logo acima de cada barra, em colunas para não encavalar
  const sorted = [...shown].sort((a, b) => b.v - a.v);
  sorted.forEach(m => svgs += `<rect x="${ML}" y="${y(m.v) - 4}" width="${W}" height="8" fill="${m.color === "green" ? GREEN : "#E30613"}"/>`);
  const cols = [ML + 14, ML + 280, ML + 546, ML + 812], colPrev = cols.map(() => -Infinity), lh = fs + 8;
  sorted.forEach(m => {
    const yy = y(m.v), want = yy - 10;
    let c = colPrev.findIndex(p => want - lh >= p);
    let ly = want;
    if (c < 0) { c = colPrev.indexOf(Math.min(...colPrev)); ly = colPrev[c] + lh; }
    colPrev[c] = ly;
    svgs += `<text x="${cols[c]}" y="${ly}" font-family="Barlow, Arial, sans-serif" font-weight="700" font-size="${fs + 4}" fill="${m.color === "green" ? GREEN_TXT : "#B00010"}" paint-order="stroke" stroke="#F2F4F5" stroke-width="7">${m.label}</text>`;
  });
  svgs += `</svg>`;
  const legend = sorted.length ? `<ol class="marklist">${[...sorted].sort((a, b) => a.v - b.v).map(m =>
    `<li><span class="sw" style="background:${m.color === "green" ? GREEN : "#E30613"}"></span><strong>${m.label}</strong><span>${m.sub}</span></li>`).join("")}</ol>` : "";

  const hasGreen = marks.some(m => m.color === "green"), hasRed = marks.some(m => m.color !== "green");
  const controls = `<div class="overlap">
      <button id="ovBtn" aria-pressed="${sheetState.layered}" ${hasOverlap ? "" : "disabled"}>${sheetState.layered ? "Mostrar todas as faixas" : "Tirar sobreposição"}</button>
      ${sheetState.layered ? `<button id="ovPrev">Anterior</button><span>Faixas sobrepostas: ${sheetState.layer + 1} de ${layers}</span><button id="ovNext">Próxima</button>` : ""}
      ${hasOverlap ? "" : `<span class="hint" style="margin:0">Nenhuma faixa sobreposta.</span>`}
    </div>`;
  box.innerHTML = `<h3>${title}</h3>${note ? `<p class="hint">${note}</p>` : ""}
    ${marks.length ? controls : `<p class="hint">Nenhuma marca cai dentro de uma folha de ${mm(L)} mm.</p>`}${svgs}${legend}
    <p class="hint">${hasRed ? "Vermelho: impacto direto. " : ""}${hasGreen ? `Verde: impacto do molhador ${LBL(DAMP)} transmitido ${TLIST()}. ` : ""}Faixa cinza: pinça. Área rosada: imagem. Largura da folha apenas ilustrativa.</p>`;
  const rerender = () => paintSheet(box, P, title, marks, note);
  const ov = box.querySelector("#ovBtn");
  if (ov) ov.addEventListener("click", () => { sheetState.layered = !sheetState.layered; sheetState.layer = 0; rerender(); });
  const pv = box.querySelector("#ovPrev"), nx = box.querySelector("#ovNext");
  if (pv) pv.addEventListener("click", () => { sheetState.layer = (sheetState.layer - 1 + layers) % layers; rerender(); });
  if (nx) nx.addEventListener("click", () => { sheetState.layer = (sheetState.layer + 1) % layers; rerender(); });
}

/* Pontos vermelhos de impacto: presos à chapa (no contato chapa–blanqueta) e ao papel
   (no contato blanqueta–impressão) no momento de cada evento */
const impactMarks = {};
const pulseLayer = el("g", { "pointer-events": "none" }, svg);
let prevX = null;
function markOn(o, worldDeg, radius, label, list) {
  const a = (worldDeg - o.angle) * Math.PI / 180;
  const g = el("g", { transform: `translate(${(Math.cos(a) * radius).toFixed(2)} ${(Math.sin(a) * radius).toFixed(2)})` }, o.rot);
  el("circle", { r: 9, fill: "#E30613", stroke: "#fff", "stroke-width": 2.5 }, g);
  const t = el("text", { x: 13, y: -11, fill: "#E30613", "font-family": "Barlow, Arial, sans-serif", "font-weight": 700,
    "font-size": 15, "paint-order": "stroke", stroke: "#fff", "stroke-width": 4 }, g);
  t.textContent = label;
  list.push(g);
}
function pulseAt(o, worldDeg) {
  const a = worldDeg * Math.PI / 180;
  const c = el("circle", { class: "impact-pulse", cx: o.x + Math.cos(a) * o.r, cy: o.y + Math.sin(a) * o.r, r: 14,
    fill: "none", stroke: "#E30613", "stroke-width": 4 }, pulseLayer);
  setTimeout(() => c.remove(), 1300);
}
function fireImpact(ev) {
  (impactMarks[ev.code] || []).forEach(n => n.remove());
  const list = impactMarks[ev.code] = [];
  const L = readParams().Ls;
  const label = ev.code;
  markOn(R.chapa, NIP.PB, R.chapa.r - 10, label, list);                 // chapa no contato com a blanqueta
  if (paperAt(ev) >= 0 && paperAt(ev) <= L) markOn(R.impressao, NIP.IB, R.impressao.r + 4, label, list);  // papel no contato
  pulseAt(ev.where === "pb" ? R.chapa : R.impressao, ev.where === "pb" ? NIP.PB : NIP.IB);
}
function clearImpacts() { Object.values(impactMarks).forEach(l => l.forEach(n => n.remove())); prevX = null; }
function trackImpacts() {
  if (!manchasOn) { prevX = null; return; }
  const x = sheetX();
  if (prevX !== null && x !== prevX) {
    const fwd = mod(x - prevX, CYL_C), back = mod(prevX - x, CYL_C);
    impactEvents(readParams().Ls).forEach(ev => {
      if (fwd < CYL_C / 2) { const d = mod(ev.x - prevX, CYL_C); if (d > 0 && d <= fwd) fireImpact(ev); }
      else { const d = mod(prevX - ev.x, CYL_C); if (d >= 0 && d < back) fireImpact(ev); }
    });
  }
  prevX = x;
}

/* Tabela dos momentos de impacto */
function buildTable() {
  const P = readParams(), L = P.Ls;
  const refs = gapStreaks(P);
  const evName = ev => ev.code === "Descarga" ? "Descarga" : ev.code;
  const rows = impactEvents(L).sort((a, b) => streakAt(a) - streakAt(b)).map(ev => {
    const pp = paperAt(ev), pl = plateAt(ev), st = streakAt(ev);
    const onPaper = pp >= 0 && pp <= L, plateOk = pl >= GRIPPER && pl <= GRIPPER + CYL_C - R.chapa.gapMm;
    const ok = st >= 0 && st <= L && (ev.where === "bi" ? plateOk : onPaper);
    const ref = refs.find(g => g.code === ev.code);
    return `<tr>
      <td><strong>${evName(ev)}</strong><small>${ev.text}</small></td>
      <td>${ev.where === "pb" ? "Chapa–blanqueta" : "Blanqueta–impressão"}</td>
      <td>${onPaper ? `${mm(pp)} mm` : "Sem papel (boca)"}</td>
      <td>${plateOk ? `${mm(pl)} mm` : "Na boca da chapa"}</td>
      <td>${ok ? `<span class="hit">${mm(st)} mm</span><br><small>${ev.where === "bi" ? "no contato chapa–blanqueta" : "no contato blanqueta–impressão"}</small>` : "Fora da folha"}</td>
      <td>${ref && !isNaN(ref.v) ? mm(ref.v) + " mm" : "—"}</td>
      <td>${ok ? `<button data-ev="${ev.code}">Ver na folha</button>` : ""}</td></tr>`;
  });
  const box = document.getElementById("gapTable");
  box.innerHTML = `<h3>Momentos de impacto numa folha de ${mm(L)} mm</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Momento</th><th>Onde acontece</th><th>Papel no contato blanqueta–impressão</th>
      <th>Chapa no contato chapa–blanqueta</th><th>Onde a listra aparece</th><th>Heidelberg</th><th></th></tr></thead>
      <tbody>${rows.join("")}</tbody></table></div>
    <p class="hint">Medidas a partir da borda frontal da folha, com pinça de ${GRIPPER} mm. A posição da chapa está em mm da folha (a chapa começa a ${GRIPPER} mm). Calibração pelos valores Heidelberg: a blanqueta leva ${mm(BLANKET_TRAVEL)} mm de um contato ao outro e as bocas da blanqueta e da impressão foram ajustadas para ${R.blanqueta.gapMm} mm. Pelo mecanismo dos slides, um tranco entre blanqueta e impressão marca o ponto da chapa, e um tranco entre chapa e blanqueta marca o ponto do papel. A descarga acompanha o formato: E1 − (formato máximo − formato atual).</p>`;
  // impacto transmitido pelo molhador
  const trRows = TRANSMIT.flatMap(id => {
    const t = transmittedFor(id, P), name = roleName(R[id]);
    return ["saída", "entrada"].map(code => {
      const ms = t.marks.filter(m => m.code === code && m.v >= 0 && m.v <= L);
      return `<tr><td><strong>${name}</strong>${t.linked ? "" : "<small>Sem contato com o ${LBL(DAMP)} agora</small>"}</td>
        <td>Molhador na ${code} da boca da chapa (${code === "saída" ? mm(P.c1) : mm(P.c4)} mm)</td>
        <td>${mm(t.arc)} mm</td><td>${mm(t.circ)} mm</td>
        <td>${ms.length ? ms.map(m => `<span class="hit green">${mm(m.v)} mm</span> <small>${ord(m.k)}${m.next ? ", folha seguinte" : ""}</small>`).join("<br>") : "Nenhuma na folha"}</td>
        <td>${ms.length ? `<button data-tr="${id}">Ver na folha</button>` : ""}</td></tr>`;
    });
  });
  box.insertAdjacentHTML("beforeend", `<h3>Impacto do molhador transmitido ${TLIST()}</h3>
    <div class="tablewrap"><table>
      <thead><tr><th>Rolo</th><th>Impacto no molhador</th><th>Percurso no ${LBL(DAMP)} até a chapa</th><th>Circunferência</th><th>Marcas no papel</th><th></th></tr></thead>
      <tbody>${trRows.join("")}</tbody></table></div>
    <p class="hint">A marca fica no rolo que encosta no molhador, volta ao contato com o ${LBL(DAMP)} a cada giro dele e percorre o ${LBL(DAMP)} até a chapa. Na folha, essas marcas aparecem em verde.</p>`);
  box.querySelectorAll("[data-tr]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.tr;
    sheetState.layer = 0;
    paintSheet(document.getElementById("sheetMap"), P, `Impacto do molhador transmitido ao ${TSHORT[id]}`, greenMarks(id, P));
    document.getElementById("sheetMap").scrollIntoView({ behavior: "smooth", block: "start" });
  }));

  const evs = impactEvents(L);
  box.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => {
    const ev = evs.find(e => e.code === b.dataset.ev), st = streakAt(ev);
    sheetState.layer = 0;
    paintSheet(document.getElementById("sheetMap"), P, `Listra de boca ${evName(ev)} na folha`,
      [{ v: st, label: `${mm(st)} mm`, sub: `${evName(ev)}, ${ev.where === "bi" ? "tranco blanqueta–impressão marcado no contato chapa–blanqueta" : "tranco chapa–blanqueta marcado no contato blanqueta–impressão"}` }]);
    document.getElementById("sheetMap").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}
$("tableBtn").addEventListener("click", () => {
  const t = $("gapTable"), open = t.hidden;
  t.hidden = !open;
  $("tableBtn").setAttribute("aria-expanded", open);
  if (open) buildTable();
});
$("fLen").addEventListener("input", () => { if (!$("gapTable").hidden) buildTable(); });

/* Papel no cilindro de impressão: preso na pinça (borda da boca que vem logo atrás dela
   no sentido de giro) e enrolado na superfície pelo comprimento digitado */
function drawPaper() {
  const o = R.impressao;
  let g = o.paper;
  if (!g) { g = o.paper = el("g", { "pointer-events": "none" }, o.rot); }
  g.replaceChildren();
  const L = num("fLen");
  if (!(L > 0)) return;
  // a borda frontal fica ${GRIPPER} mm antes da saída da boca, presa na pinça
  const a2 = gapAngles(o).a2 - GRIPPER / o.circMm * Math.PI * 2;
  const theta = Math.min(L / o.circMm, 0.985) * Math.PI * 2;  // ângulo coberto pelo papel
  const rp = o.r + 4;
  const pt = (rad, a) => `${(Math.cos(a) * rad).toFixed(2)},${(Math.sin(a) * rad).toFixed(2)}`;
  const end = a2 + theta;
  el("path", { d: `M${pt(rp, a2)} A${rp},${rp} 0 ${theta > Math.PI ? 1 : 0} 1 ${pt(rp, end)}`,
    fill: "none", stroke: "#1E7FE0", "stroke-width": 7, "stroke-linecap": "round" }, g);
  // pinça segurando a borda frontal da folha
  el("line", { x1: Math.cos(a2) * (o.r - 8), y1: Math.sin(a2) * (o.r - 8), x2: Math.cos(a2) * (o.r + 14), y2: Math.sin(a2) * (o.r + 14),
    stroke: "#F2C230", "stroke-width": 8, "stroke-linecap": "round" }, g);
  const mid = a2 + theta / 2;
  const t = el("text", { class: "info", "text-anchor": "middle", "dominant-baseline": "central", fill: "#FFFFFF",
    "font-family": "Barlow, Arial, sans-serif", "font-size": 14, "font-weight": 600,
    transform: `translate(${pt(o.r - 22, mid)}) rotate(${(mid * 180 / Math.PI + 90).toFixed(1)})` }, g);
  t.textContent = `Papel ${fmt(L)} mm`;
  const tg = el("text", { class: "info", "text-anchor": "middle", "dominant-baseline": "central", fill: "#FFFFFF",
    "font-family": "Barlow, Arial, sans-serif", "font-size": 13, "font-weight": 600,
    transform: `translate(${pt(o.r - 30, a2)}) rotate(${(a2 * 180 / Math.PI + 90).toFixed(1)})` }, g);
  tg.textContent = "pinça";
}
drawPaper();
$("fLen").addEventListener("input", drawPaper);

$("diagBtn").addEventListener("click", diagnose);
document.querySelectorAll("#diag input").forEach(i => i.addEventListener("change", () => drawSheet(selected)));
document.querySelectorAll("#diag input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") diagnose(); }));


/* ---------- Variações da máquina (M.variants) ---------- */
const inMm = v => String(Math.round(v * 10) / 10).replace(".", ",");

function applyVariant() {
  const v = VARIANT, gap = autoPlate && M.autoPlate ? M.autoPlate : v.gap;
  const circ = Math.round(Math.PI * v.d * 10) / 10;
  Object.assign(R.chapa, { d: v.d, gapMm: gap, circMm: circ });
  ["blanqueta", "impressao"].forEach(id => Object.assign(R[id], { gapMm: v.E1 != null ? v.A1 - v.E1 : gap, circMm: circ }));
  BLANKET_MM = v.A1 - GRIPPER; CYL_C = circ; PLATE_CIRC = circ;
  GAP_STREAKS.forEach(g => g.mm = v[g.code]);
  // diâmetros próprios da variação (rolos de outra geração)
  rollers.forEach(o => { if (o.idLabel) o.idLabel.textContent = LBL(o.id); });
  tags.forEach(t => { const k = t.a + "|" + t.b, nt = (v.tagText && (v.tagText[k] || v.tagText[t.b + "|" + t.a])) || t.t0;
    if (nt !== t.t) { t.t = nt; drawTagBody(t); } });
  rollers.forEach(o => { if (o.d0 === undefined) return; o.d = (v.dia && v.dia[o.id]) || o.d0; if (o.dLabel && o.id !== "chapa") o.dLabel.textContent = (o.est ? "≈Ø" : "Ø") + fmt(o.d); });
  recalibrate();
  ["chapa", "blanqueta", "impressao"].forEach(id => drawRot(R[id]));
  if (R.chapa.dLabel) R.chapa.dLabel.textContent = "Ø" + v.d;
  R.impressao.paper = null;
  clearImpacts();
  if (stripeDots.length) { placeStripeDots(); updateStripeVisibility(); }
  // padrões dos campos da análise
  const c4 = GRIPPER + circ - gap;
  $("fFmax").value = inMm(v.fmax);
  $("fC4").value = inMm(c4);
  if (num("fLen") > v.fmax) $("fLen").value = inMm(v.fmax);
  drawPaper();
  $("stdHint").textContent = `Padrões da ${v.id}${autoPlate ? " com chapa Auto/Multiplate" : ""}: contato de ${GRIPPER} a ${mm(c4)} mm (pinça de ${GRIPPER} mm + superfície útil de ${mm(circ - gap)} mm), cilindro de chapa Ø ${v.d} mm (circunferência ${mm(circ)} mm) com boca de ${inMm(gap)} mm, formato máximo ${v.fw} × ${v.fmax} mm${v.tbc ? " (a confirmar)" : ""}. Sem valor, a borda traseira da imagem fica 5 mm antes do fim da folha (no máximo ${mm(v.fmax - 5)} mm).`;
  // textos
  $("title").textContent = `Esquema de rolaria · ${v.id}`;
  document.title = `Esquema de rolaria · ${v.id}`;
  $("varOut").textContent = v.id + (autoPlate ? " AP" : "");
  $("varInfo").innerHTML = `<strong>${v.id}</strong> · Ø ${v.d} mm · boca ${inMm(gap)} mm${autoPlate ? " (Auto/Multiplate)" : ""} · A1 ${v.A1 ?? "—"} · E1 ${v.E1 ?? "—"} · A2 ${v.A2 ?? "—"} · E2 ${v.E2 ?? "—"} mm · formato ${v.fw} × ${v.fmax} mm. ${v.src}.`;
  document.querySelectorAll("[data-var]").forEach(b => b.setAttribute("aria-pressed", b.dataset.var === v.id));
  $("apBtn").setAttribute("aria-pressed", autoPlate);
  // atualiza o que estiver aberto
  if (selected && !stripeOn()) { const o = selected; selected = null; select(o); }
  if ($("diagOut").innerHTML.trim()) diagnose(); else drawSheet(selected);
  if (!$("gapTable").hidden) buildTable();
}
{
  const box = $("variants");
  VARIANTS.forEach(v => {
    const b = document.createElement("button");
    b.dataset.var = v.id; b.textContent = v.id; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => { VARIANT = v; applyVariant(); });
    box.appendChild(b);
  });
  const ap = document.createElement("button");
  ap.id = "apBtn"; ap.className = "opt"; ap.textContent = `Auto/Multiplate (boca ${M.autoPlate})`; ap.setAttribute("aria-pressed", "false");
  ap.hidden = !M.autoPlate;
  ap.addEventListener("click", () => { autoPlate = !autoPlate; applyVariant(); });
  box.appendChild(ap);
  const info = document.createElement("p");
  info.id = "varInfo"; info.className = "varinfo hint";
  box.appendChild(info);
  $("varBtn").addEventListener("click", () => {
    const open = box.classList.toggle("open");
    $("varBtn").setAttribute("aria-expanded", open);
  });
}
svg.setAttribute("viewBox", M.viewBox);
applyVariant();
syncButtons();
requestAnimationFrame(tick);
<\/script>
</body>

<script id="src-xl106" type="text/plain">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esquema de rolaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #DCE3E8;
    --ink: #13304D;
    --ink-soft: #4B6177;
    --sheet: #F8FAFB;
    --panel: #FFFFFF;
    --line: #B9C6D1;
    --safety: #F2C230;
    --safety-ink: #2A2100;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3;
      --sheet: #E7ECF0; --panel: #172838; --line: #2C4257;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1B26; --ink: #E3ECF3; --ink-soft: #9DB1C3;
    --sheet: #E7ECF0; --panel: #172838; --line: #2C4257;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 20px; border-bottom: 3px solid var(--ink);
  }
  h1 {
    margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700; font-size: 1.6rem; letter-spacing: .01em; flex: 1 1 auto;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: 600 1rem "Barlow Condensed", "Arial Narrow", sans-serif;
    padding: 9px 16px; border-radius: 4px; cursor: pointer;
    border: 2px solid var(--ink); background: transparent; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button[aria-pressed="true"] { background: var(--safety); color: var(--safety-ink); border-color: var(--safety); }
  button:focus-visible { outline: 3px solid var(--safety); outline-offset: 3px; }
  .roller:focus { outline: none; }
  .roller:focus-visible .sel { opacity: .6; }
  button svg { width: 18px; height: 18px; }
  .speed { display: flex; align-items: center; gap: 8px; font-size: .95rem; color: var(--ink-soft); }
  .speed input { accent-color: var(--safety); width: 110px; }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px;
    gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto;
  }
  .sheet {
    background: var(--sheet); border: 2px solid var(--ink); border-radius: 6px;
    padding: 8px; min-width: 0;
  }
  #diagram { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); }
  body.manchas #diagram { max-height: none; }
  .roller { cursor: pointer; }
  .jogbar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
    position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 2;
  }
  .jogbar button {
    justify-content: center; padding: 14px 10px; font-size: 1.15rem;
    background: #13304D; color: #FFFFFF; border-color: #13304D;
    box-shadow: 0 2px 0 #081827;
  }
  .jogbar button[aria-pressed="true"] { background: #F2C230; color: #2A2100; border-color: #B8900F; box-shadow: none; transform: translateY(2px); }
  .roller .hl { stroke-width: 0; }
  .roller.flash .hl { animation: flash 1s ease-in-out; }
  @keyframes flash { 0% { stroke-width: 0; } 25%, 75% { stroke-width: 10; } 100% { stroke-width: 0; } }
  .mark .halo { display: none; }
  .mark.shared .halo { display: inline; transform-box: fill-box; transform-origin: center; animation: pulse 1.1s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.9); opacity: 0; } }
  .multi { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); line-height: 1.5; }
  .multi strong { display: block; font-size: .95rem; color: var(--ink-soft); font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { .mark.shared .halo { animation: none; } }
  .hold { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .modes { display: none; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%;
    padding-top: 10px; border-top: 1px dashed var(--line); }
  .modes.open { display: flex; }
  .modes span { color: var(--ink-soft); font-size: .95rem; margin-right: 4px; }
  .modes button { min-width: 64px; justify-content: center; }
  .modes .varinfo { flex-basis: 100%; grid-column: 1 / -1; max-width: none; margin: 4px 0 0; line-height: 1.45; }
  .modes .varinfo strong { color: var(--ink); }
  .flowtab { border-collapse: collapse; font-size: .9rem; margin-top: 6px; }
  .flowtab td, .flowtab th { padding: 3px 8px 3px 0; text-align: left; }
  .flowtab th { color: var(--ink-soft); font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
  button[aria-pressed="true"] .dot { background: currentColor; }
  #diagram.hide-info .info { display: none; }
  .sep { width: 2px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .roller .sel { opacity: 0; transition: opacity .15s; }
  .roller.active .sel { opacity: 1; }

  aside {
    background: var(--panel); border: 2px solid var(--line); border-radius: 6px;
    padding: 20px; align-self: start; position: sticky; top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .empty { color: var(--ink-soft); line-height: 1.5; margin: 0; }
  .tag {
    font: 700 3.4rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 4px;
  }
  .kind { color: var(--ink-soft); margin: 0 0 18px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 12px 16px; align-items: center; }
  dt { color: var(--ink-soft); font-size: .95rem; }
  dd { margin: 0; font-weight: 600; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .note {
    margin: 18px 0 0; padding: 12px; border-left: 4px solid var(--safety);
    background: color-mix(in srgb, var(--safety) 12%, transparent); line-height: 1.45; font-size: .95rem;
  }

  .leftcol { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .diag { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 20px; }
  .diag h2 { font: 700 1.6rem/1.1 "Barlow Condensed", "Arial Narrow", sans-serif; margin: 0 0 6px; }
  .diag h3 { font: 600 1.15rem "Barlow Condensed", "Arial Narrow", sans-serif; margin: 22px 0 8px; }
  .hint { color: var(--ink-soft); line-height: 1.45; margin: 0 0 14px; max-width: 70ch; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .fields label { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; color: var(--ink-soft); }
  .fields input {
    font: 600 1.2rem "Barlow", Arial, sans-serif; color: var(--ink); background: transparent;
    border: 2px solid var(--line); border-radius: 4px; padding: 9px 10px; width: 100%;
  }
  .fields input:focus-visible { outline: 3px solid var(--safety); outline-offset: 1px; border-color: var(--ink); }
  details { margin-bottom: 14px; }
  summary { cursor: pointer; color: var(--ink-soft); margin-bottom: 12px; }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); padding: 12px 22px; font-size: 1.1rem; }
  .summary { margin: 18px 0 0; line-height: 1.5; }
  .causes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .cause {
    width: 100%; display: grid; grid-template-columns: 5.2rem 1fr auto; gap: 14px; align-items: start;
    text-align: left; font: inherit; color: var(--ink); background: transparent;
    border: 2px solid var(--line); border-radius: 4px; padding: 12px;
  }
  .cause.exact { border-color: var(--safety); }
  .cause .val { font: 700 1.5rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; }
  .cause .val small { display: block; font: 500 .8rem "Barlow", Arial, sans-serif; color: var(--ink-soft); margin-top: 4px; }
  .cause strong { display: block; font-size: 1.05rem; }
  .cause .why { display: block; margin-top: 2px; }
  .cause .calc { display: block; margin-top: 4px; color: var(--ink-soft); font-size: .92rem; }
  .cause .kind { display: inline-block; margin-top: 6px; font-size: .82rem; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-soft); }
  .cause .diff { font-weight: 700; white-space: nowrap; justify-self: start; }
