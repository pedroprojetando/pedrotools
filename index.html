<script>
const SRC = JSON.parse(document.getElementById("src").textContent);
const FAMILIES = [{"id": "f52", "num": "52", "name": "Família 52", "models": "SM 52 · PM 52", "machines": [{"key": "sm52", "name": "SM 52 · PM 52", "sub": "Molha Alcolor · Ø 180"}]}, {"id": "f74", "num": "74/75", "name": "Família 74/75", "models": "SM 74 · PM 74 · CD 74 · XL 75", "machines": [{"key": "sm74", "name": "SM 74 · PM 74", "sub": "Molha Alcolor · rolaria atual e antiga"}, {"key": "eco74", "name": "PM 74 · SM 74 Ecocolor", "sub": "Mesma tintagem · molha Ecocolor (rolos 22–27)"}, {"key": "xl75", "name": "CD 74 · XL 75", "sub": "XL 75 · CD 74 formatos F e C (com a numeração da CD 74)"}]}, {"id": "f102", "num": "92/102/104", "name": "Família 92/102/104", "models": "SM 102 · CD 102 · SX 102 · SX 104 · CX 102 · CX 104 · CS 92", "machines": [{"key": "f102", "name": "SM · CD · SX · CX 102/104 · CS 92", "sub": "7 variações de cilindro e listras de boca"}]}, {"id": "f106", "num": "105/106", "name": "Família 105/106", "models": "XL 105 · XL 106", "machines": [{"key": "xl106", "name": "XL 105 · XL 106 · XL 106 Hycolor", "sub": "Hycolor (drupa 2024), XL 106 2012–2024 e XL 105 2004–2012"}]}];
const $ = id => document.getElementById(id);
// pequena rolaria decorativa no canto de cada cartão (cores reais dos entintadores)
const deco = n => {
  const sets = { f52: ["#CFCFCF", "#CFCFCF", "#CFCFCF"], f74: ["#FFFFFF", "#0B66C2", "#E30613", "#F5E400"],
    f102: ["#FFFFFF", "#0B66C2", "#E30613", "#F5E400"], f106: ["#6B2FA0", "#F5E400", "#0FA84A", "#E30613"] }[n];
  const pos = [[70, 40, 26], [36, 70, 20], [80, 86, 18], [30, 30, 14]];
  return `<svg class="rollers" viewBox="0 0 110 110" aria-hidden="true">${sets.map((c, i) => { const [x, y, r] = pos[i];
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="#111"/><circle cx="${x}" cy="${y}" r="${r - 5}" fill="${c}"/>`; }).join("")}</svg>`;
};
function machineHtml(key) {
  if (key === "xl106") return SRC.xl106;
  return SRC.tpl.replace("/*__MACHINE__*/null", JSON.stringify(SRC.cfg[key]));
}
function renderHome() {
  $("grid").innerHTML = FAMILIES.map(f => {
    const n = f.machines.length, ready = n > 0;
    return `<button class="card ${ready ? "ready" : "empty"}" data-fam="${f.id}" ${ready ? "" : 'aria-disabled="true"'}>
      ${deco(f.id)}<span class="num">${f.num}</span><span class="fam">${f.name}</span>
      <span class="models">${f.models}</span>
      <span class="status">${ready ? (n === 1 ? "1 esquema" : n + " esquemas") : "Aguardando desenhos da rolaria"}</span></button>`;
  }).join("");
  $("grid").querySelectorAll("[data-fam]").forEach(b => b.addEventListener("click", () => {
    const f = FAMILIES.find(x => x.id === b.dataset.fam);
    if (!f.machines.length) { location.hash = f.id; return; }
    location.hash = f.machines.length === 1 ? `${f.id}/${f.machines[0].key}` : f.id;
  }));
}
let current = null;
function route() {
  const [fid, mkey] = location.hash.replace("#", "").split("/");
  const f = FAMILIES.find(x => x.id === fid);
  const showHome = !f;
  $("home").hidden = !showHome;
  $("familyView").hidden = showHome || !!mkey;
  $("viewer").hidden = !(f && mkey);
  document.body.style.overflow = f && mkey ? "hidden" : "";
  if (showHome) { document.title = "Esquemas de rolaria"; return; }
  if (!mkey) {
    $("famTitle").textContent = f.name;
    $("machGrid").innerHTML = f.machines.map(m => `<button class="card ready" data-m="${m.key}">
      <span class="num" style="font-size:2.2rem">${m.name}</span><span class="models">${m.sub}</span>
      <span class="status">Abrir esquema</span></button>`).join("");
    $("machGrid").querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { location.hash = `${f.id}/${b.dataset.m}`; }));
    $("famNote").hidden = !!f.machines.length;
    $("famNote").textContent = f.machines.length ? "" : `Ainda não há esquema para a ${f.name}. Assim que os desenhos da rolaria chegarem, o esquema entra aqui, no mesmo formato das outras famílias.`;
    document.title = f.name;
    return;
  }
  const m = f.machines.find(x => x.key === mkey);
  if (!m) { location.hash = f.id; return; }
  $("crumb").innerHTML = `${f.name} · <strong>${m.name}</strong>`;
  $("vBack").textContent = f.machines.length > 1 ? "← " + f.name : "← Famílias";
  $("vBack").onclick = () => { location.hash = f.machines.length > 1 ? f.id : ""; };
  document.title = m.name;
  if (current !== mkey) { $("frame").srcdoc = machineHtml(mkey); current = mkey; }
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
renderHome();
window.addEventListener("hashchange", route);
route();
</script>
