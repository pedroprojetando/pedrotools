g viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 3.2\"><path d=\"M4 12a8 8 0 1 0 2.4-5.7\"/><\/svg>\n      Picote para frente\n      <\/button>\n      <button id=\"jogB\" class=\"hold\" aria-pressed=\"false\" title=\"Segure para girar\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-dasharray=\"3 3.2\"><path d=\"M20 12a8 8 0 1 1-2.4-5.7\"/><\/svg>\n      Picote para trás\n      <\/button>\n    <\/div>\n  <\/div>\n  <section class=\"diag\" id=\"diag\" hidden aria-labelledby=\"diagTitle\">\n    <h2 id=\"diagTitle\">Análise de manchas<\/h2>\n    <p class=\"hint\">Informe as medidas a partir da borda frontal da folha. O cálculo usa os diâmetros do esquema e os contatos na posição atual da máquina (entintadores, molha e intermediário).<\/p>\n    <div class=\"fields\">\n      <label>Comprimento da folha (mm)<input id=\"fLen\" type=\"text\" inputmode=\"decimal\" value=\"720\"><\/label>\n      <label>Altura da mancha (mm)<input id=\"fPos\" type=\"text\" inputmode=\"decimal\" placeholder=\"ex.: 588\"><\/label>\n      <label>Vario do molhador (%)<input id=\"fVario\" type=\"text\" inputmode=\"decimal\" value=\"0\"><\/label>\n      <label>Distância entre faixas repetidas (mm)<input id=\"fRep\" type=\"text\" inputmode=\"decimal\" placeholder=\"opcional\"><\/label>\n    <\/div>\n    <details>\n      <summary>Bordas da imagem e da chapa<\/summary>\n      <div class=\"fields\">\n        <label>Início do contato com a chapa (mm)<input id=\"fC1\" type=\"text\" inputmode=\"decimal\" value=\"10\"><\/label>\n        <label>Borda frontal da imagem (mm)<input id=\"fImgF\" type=\"text\" inputmode=\"decimal\" value=\"10\"><\/label>\n        <label>Borda traseira da imagem (mm)<input id=\"fImgR\" type=\"text\" inputmode=\"decimal\" placeholder=\"automático\"><\/label>\n        <label>Fim do contato com a chapa (mm)<input id=\"fC4\" type=\"text\" inputmode=\"decimal\" value=\"723,2\"><\/label>\n        <label>Formato máximo da máquina (mm)<input id=\"fFmax\" type=\"text\" inputmode=\"decimal\" value=\"720\"><\/label>\n        <label>Registro circunferencial (mm)<input id=\"fReg\" type=\"text\" inputmode=\"decimal\" value=\"0\"><\/label>\n      <\/div>\n      <p class=\"hint\" id=\"stdHint\"><\/p>\n    <\/details>\n    <div class=\"actions\">\n      <button id=\"diagBtn\" class=\"primary\">Diagnosticar<\/button>\n      <button id=\"tableBtn\" aria-expanded=\"false\" aria-controls=\"gapTable\">Tabela<\/button>\n    <\/div>\n    <div id=\"gapTable\" class=\"gaptable\" hidden><\/div>\n    <div id=\"diagOut\" aria-live=\"polite\"><\/div>\n    <div id=\"sheetMap\" class=\"sheetmap\"><\/div>\n  <\/section>\n  <\/div>\n  <aside id=\"panel\" aria-live=\"polite\">\n    <p class=\"empty\">Toque em um rolo para ver o diâmetro, a cor e os contatos. Toque de novo nele, ou fora dos rolos, para desmarcar.<\/p>\n  <\/aside>\n<\/main>\n\n<script>\nconst NS = \"http://www.w3.org/2000/svg\";\n// Configuração da máquina (rolaria, movimentos, etiquetas e variações)\nconst M = /*__MACHINE__*/null;\nconst VARIANTS = M.variants;\nlet VARIANT = VARIANTS.find(v => v.id === M.defaultVariant) || VARIANTS[0];\nlet autoPlate = false;     // chapa Auto/Multiplate (quando a família tem essa opção)\nconst DAMP = M.damp;       // molhador (rolo que molha a chapa)\nconst LBL = id => (VARIANT.labels && VARIANT.labels[id]) || id;   // número mostrado do rolo\nconst svg = document.getElementById(\"diagram\");\n\nconst K = 1.25;              // unidades de desenho por mm de diâmetro (r = d·K/2)\nconst PLATE_GAP = 3 * K;     // folga de 3 mm ao desencostar do cilindro de chapa\nconst DUCTOR_GAP = 12;       // curso do tomador entre o A e o ductor\nconst TOUCH = 0.6;           // tolerância para considerar dois rolos encostados\n\n// Cores reais dos rolos (fixas, independem do tema)\nconst C = {\n  roxo: \"#6B2FA0\", branco: \"#FFFFFF\", amarelo: \"#F5E400\", verde: \"#0FA84A\",\n  vermelho: \"#E30613\", azul: \"#0B66C2\", cinza: \"#6D6D6D\", cinzaClaro: \"#CFCFCF\",\n  rilsan: \"#2B2B2B\", inox: \"#B8C2CA\"\n};\n\n// Rolos da máquina (posições com o tomador no A e todos os contatos tangentes)\nconst rollers = M.rollers.map(o => ({ ...o, fill: C[o.fill] || o.fill, d0: o.d }));\n// Modo Manchas: cilindros de blanqueta e de impressão abaixo da chapa (representação dos slides:\n// mesmo diâmetro e mesma boca da chapa, já que os valores reais não foram informados)\nrollers.push(\n  { id: \"blanqueta\", name: \"Cilindro de blanqueta\", r: rollers.find(o => o.id === \"chapa\").r, fill: \"#009A44\", stroke: \"#00652C\", tc: \"#FFFFFF\",\n    cor: \"Verde (representação)\", gapMm: 131, circMm: 848.2, assumed: true, follow: -1, manchas: true },\n  { id: \"impressao\", name: \"Cilindro de impressão\", r: rollers.find(o => o.id === \"chapa\").r, fill: \"#0B3D6E\", stroke: \"#06284A\", tc: \"#FFFFFF\",\n    cor: \"Azul-marinho (representação)\", gapMm: 131, circMm: 848.2, assumed: true, follow: 1, manchas: true }\n);\nconst R = Object.fromEntries(rollers.map(o => [o.id, o]));\nlet BLANKET_MM = 509;   // percurso calibrado na blanqueta (mm)\nconst GRIPPER = 10;       // pinça: a borda frontal da folha fica 10 mm antes da saída da boca\nfunction calibrateCyl() {\n  // blanqueta logo abaixo da chapa, impressão logo abaixo da blanqueta, levemente para a esquerda\n  const P = R.chapa, B = R.blanqueta, I = R.impressao;\n  // Calibração pelos valores Heidelberg da variação escolhida (A1, E1, A2, E2) com pinça de 10 mm:\n  //   percurso da blanqueta do contato com a chapa até o contato com a impressão = A1 − pinça,\n  //   bocas da blanqueta e da impressão = A1 − E1. A boca da chapa é a real da variação.\n  const PHI = 95, PSI = (PHI + 180 + BLANKET_MM / P.circMm * 360) % 360;\n  const at = (o, from, deg) => {\n    const a = deg * Math.PI / 180, L = from.r + o.r;\n    o.x = from.x + Math.cos(a) * L; o.y = from.y + Math.sin(a) * L;\n  };\n  at(B, P, PHI); at(I, B, PSI);\n  // bocas sincronizadas pela saída: a chapa e a blanqueta saem da boca juntas no contato entre elas,\n  // e a blanqueta e a impressão saem juntas no contato entre elas (a pinça vem logo depois)\n  const half = o => o.gapMm / o.circMm * 180;\n  const pExit = P.gapAt + half(P);              // saída da boca da chapa (gira no sentido anti-horário)\n  const bExit = 2 * PHI + 180 - pExit;          // saída da boca da blanqueta (gira no sentido horário)\n  B.gapAt = bExit + half(B);\n  const iExit = 2 * PSI + 180 - bExit;          // saída da boca da impressão, onde fica a pinça\n  I.gapAt = iExit - half(I);\n}\n// Momentos de impacto entre cilindros, na coordenada x = ponto do papel que está\n// no contato blanqueta–impressão (mm a partir da borda frontal)\nlet CYL_C = 848.2;   // circunferência dos cilindros (π × Ø)\nconst deg = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;\nconst mod = (v, m) => ((v % m) + m) % m;\nconst NIP = {};\nlet BLANKET_TRAVEL = 0;\nfunction recalibrate() {\n  calibrateCyl();\n  NIP.PB = deg(R.chapa, R.blanqueta);      // direção do contato chapa–blanqueta vista da chapa\n  NIP.BP = deg(R.blanqueta, R.chapa);\n  NIP.BI = deg(R.blanqueta, R.impressao);\n  NIP.IB = deg(R.impressao, R.blanqueta);  // direção do contato blanqueta–impressão vista da impressão\n  // percurso da superfície da blanqueta do contato com a chapa até o contato com a impressão (sentido horário)\n  BLANKET_TRAVEL = mod(NIP.BI - NIP.BP, 360) / 360 * CYL_C;\n}\nrecalibrate();\n// x = superfície da impressão que está no contato blanqueta–impressão (0 = saída da boca, onde fica a pinça).\n// Na folha: posição = x + pinça.\nfunction fmaxNow() { const v = readParams().fmax; return v > 0 ? v : VARIANT.fmax; }\nconst gs = code => { const v = GAP_STREAKS.find(g => g.code === code).mm; return v == null ? null : v; };\nfunction impactEvents(L) {\n  const gBI = Math.max(R.blanqueta.gapMm, R.impressao.gapMm), gPB = gs(\"A2\") != null && gs(\"E2\") != null ? gs(\"A2\") - gs(\"E2\") : Math.max(R.chapa.gapMm, R.blanqueta.gapMm);   // boca efetiva chapa–blanqueta (A2 − E2)\n  const a2 = mod(-BLANKET_TRAVEL, CYL_C);\n  return [\n    { code: \"A1\", where: \"bi\", x: 0, text: \"Início da pressão entre impressão e blanqueta (saída da boca)\" },\n    { code: \"E1\", where: \"bi\", x: CYL_C - gBI, text: \"Fim da pressão entre impressão e blanqueta (entrada da boca)\" },\n    { code: \"Descarga\", where: \"bi\", x: CYL_C - gBI - (fmaxNow() - Math.min(L, fmaxNow())), text: \"Descarga: a borda traseira do papel sai do contato blanqueta–impressão\" },\n    { code: \"A2\", where: \"pb\", x: a2, text: \"Início da pressão entre blanqueta e chapa (saída da boca)\" },\n    { code: \"E2\", where: \"pb\", x: mod(a2 - gPB, CYL_C), text: \"Fim da pressão entre blanqueta e chapa (entrada da boca)\" }\n  ];\n}\n// Onde a listra aparece na folha (mecanismo dos slides Heidelberg):\n//  - tranco no contato blanqueta–impressão → listra no contato chapa–blanqueta (ponto da chapa naquele instante)\n//  - tranco no contato chapa–blanqueta → listra no contato blanqueta–impressão (ponto do papel naquele instante)\nconst paperAt = ev => ev.x + GRIPPER;                               // ponto do papel no contato blanqueta–impressão\nconst plateAt = ev => mod(ev.x + BLANKET_TRAVEL + GRIPPER, CYL_C);  // ponto da chapa no contato, em mm da folha\nconst streakAt = ev => ev.where === \"bi\" ? plateAt(ev) : paperAt(ev);\n// ponto do papel que está no contato blanqueta–impressão agora\nfunction sheetX() {\n  const I = R.impressao, a2 = gapAngles(I).a2 * 180 / Math.PI;\n  return mod(NIP.IB - (a2 + I.angle), 360) / 360 * CYL_C;\n}\nlet manchasOn = false;\nconst isOff = o => o.manchas && !manchasOn;\nconst isLetter = id => /^([A-Z]|FR|E\\d)$/.test(id);\n\n// Etiquetas de ajuste (largura da faixa de contato em mm), presas ao par de rolos\nconst tags = M.tags.map(t => ({ ...t }));\n\n/* ---------- Geometria ---------- */\nconst dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);\nrollers.forEach(o => { o.bx = o.x; o.by = o.y; });\n\n// Ductor afastado levemente do tomador; o tomador vai do A (s=0) até o ductor (s=1)\n{\n  const t = R[M.vibrator], dc = R.ductor, L = dist(t, dc);\n  const ux = (dc.x - t.x) / L, uy = (dc.y - t.y) / L;\n  dc.bx = dc.x = t.x + ux * (t.r + dc.r + DUCTOR_GAP); dc.by = dc.y = t.y + uy * (t.r + dc.r + DUCTOR_GAP);\n  t.atA = { x: t.x, y: t.y };\n  t.atDuctor = { x: t.x + ux * DUCTOR_GAP, y: t.y + uy * DUCTOR_GAP };\n}\n\n// Rolo que gira em torno de um distribuidor fixo até ficar a PLATE_GAP do cilindro de chapa\nfunction makePivot(id, pivotId) {\n  const o = R[id], p = R[pivotId], cyl = R.chapa;\n  const rho = dist(o, p), phi0 = Math.atan2(o.by - p.y, o.bx - p.x);\n  const f = phi => Math.hypot(p.x + rho * Math.cos(phi) - cyl.x, p.y + rho * Math.sin(phi) - cyl.y);\n  const target = o.r + cyl.r + PLATE_GAP;\n  const sign = f(phi0 + 1e-3) > f(phi0 - 1e-3) ? 1 : -1;\n  let lo = 0, hi = 0.5;\n  for (let i = 0; i < 60; i++) {\n    const mid = (lo + hi) / 2;\n    if (f(phi0 + sign * mid) < target) lo = mid; else hi = mid;\n  }\n  return { o, p, rho, phi0, dphi: sign * hi };\n}\nfunction placePivot(pv, t) {\n  const phi = pv.phi0 + pv.dphi * t;\n  pv.o.x = pv.p.x + pv.rho * Math.cos(phi);\n  pv.o.y = pv.p.y + pv.rho * Math.sin(phi);\n}\n// Centro de um rolo a uma distância exata de outros dois (encostado ou com folga ga/gb),\n// escolhendo a solução mais próxima da posição original\nfunction tangentTo(a, b, o, ga = 0, gb = 0) {\n  const r1 = a.r + o.r + ga, r2 = b.r + o.r + gb, d = dist(a, b);\n  const l = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - l * l));\n  const mx = a.x + (b.x - a.x) * l / d, my = a.y + (b.y - a.y) * l / d;\n  const nx = -(b.y - a.y) / d, ny = (b.x - a.x) / d;\n  const c1 = { x: mx + nx * h, y: my + ny * h }, c2 = { x: mx - nx * h, y: my - ny * h };\n  const near = { x: o.bx, y: o.by };\n  const c = dist(c1, near) < dist(c2, near) ? c1 : c2;\n  o.x = c.x; o.y = c.y;\n}\n\nconst inkPivots = M.pivots.map(([id, p]) => makePivot(id, p));\n\n// inkT: entintadores afastados da chapa · waterT: molhador afastado da chapa\n// zwT: intermediário desengatado · tomS: tomador 0 no A, 1 no ductor\nfunction layout(inkT, waterT, tomS, zwT = 0) {\n  // Entintadores giram nos distribuidores\n  inkPivots.forEach(pv => placePivot(pv, inkT));\n  // Demais rolos móveis, na ordem da configuração\n  const g = { water: waterT, zw: zwT, ink: inkT };\n  M.steps.forEach(st => {\n    const o = R[st.id];\n    if (st.follow) { const f = R[st.follow]; o.x = o.bx + f.x - f.bx; o.y = o.by + f.y - f.by; return; }\n    tangentTo(R[st.a], R[st.b], o, PLATE_GAP * (g[st.ga] || 0), PLATE_GAP * (g[st.gb] || 0));\n  });\n  // Tomador\n  const t = R[M.vibrator];\n  t.x = t.atA.x + (t.atDuctor.x - t.atA.x) * tomS;\n  t.y = t.atA.y + (t.atDuctor.y - t.atA.y) * tomS;\n}\n\nfunction contactsOf(o) {\n  return rollers.filter(q => q !== o && !q.dashed && !o.dashed && !isOff(q) && !isOff(o) && dist(o, q) <= o.r + q.r + TOUCH);\n}\nconst nameOf = o => o.name || (o.kind ? `${LBL(o.id)} (${o.kind.replace(/ \\(.*\\)/, \"\").toLowerCase()})` : LBL(o.id));\n\n/* ---------- Desenho ---------- */\nfunction el(tag, attrs, parent) {\n  const n = document.createElementNS(NS, tag);\n  for (const k in attrs) n.setAttribute(k, attrs[k]);\n  if (parent) parent.appendChild(n);\n  return n;\n}\nfunction txt(parent, str, attrs) {\n  const t = el(\"text\", Object.assign({ \"text-anchor\": \"middle\", \"dominant-baseline\": \"central\",\n    \"font-family\": \"Barlow, Arial, sans-serif\" }, attrs), parent);\n  t.textContent = str;\n  return t;\n}\nconst fmt = n => n.toLocaleString(\"pt-BR\");\n\nconst feedLine = el(\"polyline\", { fill: \"none\", stroke: \"#111\", \"stroke-width\": 2.5 }, svg);\n{ // linhas de entrada tangentes ao ductor\n  const c = R.ductor, ax = c.x + M.feed[0], ay = c.y + M.feed[1];\n  const d = Math.hypot(c.x - ax, c.y - ay),  \"blur\"].forEach(ev => btn.addEventListener(ev, end));\n  btn.addEventListener(\"contextmenu\", e => e.preventDefault());\n  btn.addEventListener(\"keydown\", e => { if ((e.key === \" \" || e.key === \"Enter\") && !e.repeat) { e.preventDefault(); jogDir = d; syncButtons(); } });\n  btn.addEventListener(\"keyup\", e => { if (e.key === \" \" || e.key === \"Enter\") end(); });\n}\nholdButton($(\"jogF\"), 1);\nholdButton($(\"jogB\"), -1);\n\n$(\"info\").addEventListener(\"click\", () => {\n  const hide = svg.classList.toggle(\"hide-info\");\n  $(\"info\").setAttribute(\"aria-pressed\", hide);\n  $(\"info\").textContent = hide ? \"Mostrar informações\" : \"Ocultar informações\";\n});\n\n/* ---------- Animação ---------- */\nconst approach = (v, target, step) => v < target ? Math.min(target, v + step) : Math.max(target, v - step);\nlet last = performance.now();\nfunction tick(now) {\n  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));\n  last = now;\n  // encostar/desencostar leva cerca de 0,4 s\n  inkT = approach(inkT, inkOn ? 0 : 1, dt / 0.4);\n  waterT = approach(waterT, waterOn ? 0 : 1, dt / 0.4);\n  zwT = approach(zwT, zwOn ? 0 : 1, dt / 0.4);\n\n  const d = effDir();\n  if (d !== 0) {\n    const base = Number(speed.value); // graus/s de um rolo de raio 50\n    rollers.forEach(o => {\n      // mesma velocidade de superfície: rolos menores giram mais rápido\n      if (!o.follow) o.angle = (o.angle - d * base * (50 / o.r) * dt) % 360;\n    });\n    rollers.forEach(o => { if (o.follow) o.angle = o.follow * R.chapa.angle; });\n    plateRevs += base * (50 / R.chapa.r) * dt / 360;\n  }\n  tomS = approach(tomS, tomOn ? tomadorPos(plateRevs - tomRev0) : 0, dt / 0.25);\n  layout(inkT, waterT, tomS, zwT);\n  watchContacts();\n  trackImpacts();\n  render();\n  updatePanel();\n  requestAnimationFrame(tick);\n}\n/* ---------- Análise de manchas ---------- */\nlet PLATE_CIRC = 848.2;   // circunferência da chapa da variação (π × Ø)\nconst TOL = 5;              // variação de leitura considerada (mm)\n// Listras de boca pelos valores Heidelberg (SX 102), a partir da borda frontal, no formato máximo\n//   A1 = início blanqueta × contra-pressão, E1 = fim blanqueta × contra-pressão,\n//   A2 = início chapa × blanqueta,          E2 = fim chapa × blanqueta\n// Regras da Tabela de manchas: descarga = E1 − (formato máximo − formato atual);\n// A2 e E2 variam com o registro circunferencial.\nconst GAP_STREAKS = [\n  { code: \"A1\", mm: 519, text: \"Início blanqueta × contra-pressão (A1)\" },\n  { code: \"E1\", mm: 388, text: \"Fim blanqueta × contra-pressão (E1)\" },\n  { code: \"A2\", mm: 349, text: \"Início chapa × blanqueta (A2)\" },\n  { code: \"E2\", mm: 212, text: \"Fim chapa × blanqueta (E2)\" }\n];\n// Faixas periódicas: circunferência (π × d) dos rolos que tocam a chapa + engrenagens da variação\nfunction periodicList() {\n  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);\n  return FORM_ROLLERS.map(id => { const o = R[id], k = o.kind ? o.kind.replace(/ \\(.*\\)/, \"\") : \"Rolo\";\n    return { mm: Math.PI * o.d, text: `${cap(k)} (rolo ${LBL(id)}, Ø ${fmt(o.d)})`, roller: id }; })\n    .concat(VARIANT.gears || []).concat(masterRep());\n}\n// distâncias periódicas da Tabela master (engrenagens, distribuidor, vibrador…) que ainda não estão na lista\nfunction masterRep() {\n  const base = VARIANT.gears || [], out = [];\n  ((VARIANT.master && VARIANT.master.rep) || []).forEach(r => {\n    if (/Abertura da pinça/.test(r.t)) return;   // já estão nas listras dinâmicas da variação\n    if ([...base, ...out].some(g => Math.abs(g.mm - r.v) < 0.15)) return;\n    out.push({ mm: r.v, text: `${r.t} (Tabela master${r.o ? \", \" + r.o : \"\"})` });\n  });\n  return out;\n}\n// linhas da Tabela master de manchas perto da altura medida\nfunction masterHtml(pos) {\n  const mt = VARIANT.master; if (!mt || !mt.pos.length) return \"\";\n  const d = r => r.v2 ? (pos < r.v ? r.v - pos : pos > r.v2 ? pos - r.v2 : 0) : Math.abs(pos - r.v);\n  const hits = mt.pos.filter(r => d(r) <= TOL + 1e-9).sort((a, b) => d(a) - d(b)).slice(0, 10);\n  const head = `<h3>Tabela master de manchas${mt.base ? ` (lista da ${mt.base}, como base)` : \"\"}<\/h3>`;\n  if (!hits.length) return head + `<p class=\"hint\">Nenhuma linha da tabela entre ${mm(pos - TOL)} e ${mm(pos + TOL)} mm.<\/p>`;\n  return head + `<ol class=\"causes\">${hits.map(r => { const dd = d(r), ex = dd <= 0.5;\n    return `<li><div class=\"cause${ex ? \" exact\" : \"\"}\"><span class=\"val\">${r.v2 ? `${fmt(r.v)}–${fmt(r.v2)}` : fmt(r.v)}<small>mm<\/small><\/span>\n      <span><strong>${r.t}<\/strong>${r.o ? `<span class=\"why\">${r.o}<\/span>` : \"\"}<span class=\"kind\">Tabela master · ${r.m}<\/span><\/span>\n      <span class=\"diff\">${ex ? \"exato\" : (dd > 0 ? \"± \" : \"\") + mm(dd) + \" mm\"}<\/span><\/div><\/li>`; }).join(\"\")}<\/ol>\n    <p class=\"hint\">Valores de referência medidos em máquina (sem registro circunferencial). “Entintador 1–4” segue a ordem da tabela: 1º a 4º entintador a partir da molha.<\/p>`;\n}\nfunction gapStreaks(P) {\n  const fmax = isNaN(P.fmax) ? VARIANT.fmax : P.fmax, reg = P.reg || 0;\n  const out = GAP_STREAKS.map(g => {\n    let v = g.mm, calc = `Valor Heidelberg: ${g.mm} mm`;\n    if ((g.code === \"A2\" || g.code === \"E2\") && reg) {\n      v = g.mm + reg;\n      calc = `Heidelberg: ${g.mm} mm ${reg > 0 ? \"+\" : \"−\"} ${mm(Math.abs(reg))} mm de registro circunferencial = ${mm(v)} mm`;\n    }\n    return g.mm == null ? { ...g, v: NaN, calc: \"Sem valor na tabela Heidelberg\", hidden: true } : { ...g, v, calc };\n  });\n  // descarga: no formato máximo coincide com o E1; em formato menor, anda junto com a borda traseira\n  const e1 = GAP_STREAKS.find(g => g.code === \"E1\").mm;\n  if (e1 == null) return out;\n  const L = P.L > 0 ? P.L : fmax;\n  if (L !== fmax) out.push({ code: \"Descarga\", mm: e1, v: e1 - (fmax - L), text: \"Descarga: fim do papel no contato blanqueta × contra-pressão\",\n    calc: `Descarga: ${e1} − (${mm(fmax)} − ${mm(L)}) = ${mm(e1 - (fmax - L))} mm` });\n  else out.push({ code: \"Descarga\", mm: e1, v: e1, text: \"Descarga: fim do papel no contato blanqueta × contra-pressão\",\n    calc: `No formato máximo (${mm(fmax)} mm), a descarga coincide com o E1: ${e1} mm`, hidden: true });\n  return out;\n}\nconst num = id => {\n  const v = document.getElementById(id).value.trim().replace(\",\", \".\");\n  return v === \"\" ? NaN : Number(v);\n};\nconst mm = v => v.toLocaleString(\"pt-BR\", { minimumFractionDigits: 1, maximumFractionDigits: 1 });\nconst ord = k => k + \"º giro\";\nfunction roleName(o) {\n  const k = o.kind ? o.kind.replace(/ \\(.*\\)/, \"\") : \"\";\n  if (isLetter(o.id)) return k ? `${k} ${o.id}` : `Distribuidor ${o.id}`;\n  if (k) return `Rolo ${LBL(o.id)} (${k.toLowerCase()})`;\n  return `Rolo ${LBL(o.id)}`;\n}\nconst shortName = id => { const o = R[id], k = o.kind ? o.kind.replace(/ \\(.*\\)/, \"\").toLowerCase() : \"rolo\"; return `${k} ${LBL(id)}`; };\nconst joinE = list => list.length < 2 ? list.join(\"\") : list.slice(0, -1).join(\", \") + \" e \" + list[list.length - 1];\nconst touchList = () => `Toque num entintador (${joinE(FORM_ROLLERS.filter(id => id !== DAMP).map(LBL))}), no molhador ${LBL(DAMP)}, ${TRANSMIT.map(id => \"no \" + shortName(id)).join(\", \")} ou num cilindro`;\n\n// Só marcam o impresso os rolos que tocam a chapa (entintadores 14, 1, 2, 13 e molhador 16)\n// e os contatos entre cilindros (listras de boca). Os demais só transferem tinta/água.\nconst FORM_ROLLERS = [...M.form, DAMP];\nconst GAP_BY_CYL = { chapa: [\"E2\", \"A2\"], blanqueta: [\"E2\", \"E1\", \"A2\", \"A1\", \"Descarga\"], impressao: [\"E1\", \"A1\", \"Descarga\"] };\n\nfunction readParams() {\n  const L = num(\"fLen\"), vario = num(\"fVario\") || 0;\n  const c1 = num(\"fC1\"), imgF = num(\"fImgF\"), c4 = num(\"fC4\");\n  let imgR = num(\"fImgR\");\n  const Ls = L > 0 ? L : VARIANT.fmax;\n  if (isNaN(imgR)) imgR = Math.min(Ls, isNaN(c4) ? Ls : c4) - 5;\n  return { L, Ls, pos: num(\"fPos\"), vario, c1, imgF, imgR, c4, fmax: num(\"fFmax\"), reg: num(\"fReg\") || 0, rep: num(\"fRep\") };\n}\n\n// Posições (mm a partir da borda frontal) onde um rolo de forma marca a folha\nfunction streaksFor(o, P, limit = 0) {\n  const isDamp = o.id === DAMP;\n  const circ = Math.PI * o.d * (isDamp ? 1 + P.vario / 100 : 1);\n  const circTxt = isDamp && P.vario ? `π × ${fmt(o.d)} × ${fmt(1 + P.vario / 100)} = ${mm(circ)} mm` : `π × ${fmt(o.d)} = ${mm(circ)} mm`;\n  const front = [], rear = [];\n  if (!isNaN(P.c1)) front.push({ at: P.c1, text: \"Início do contato com a chapa, na saída da boca (causa 1)\", short: \"saída da boca\" });\n  if (!isNaN(P.imgF)) front.push({ at: P.imgF, text: \"Borda frontal da imagem (causa 2)\", short: \"borda frontal da imagem\" });\n  // Tabela de manchas: rolaria = diâmetro × 3,14, contada da borda frontal sem somar a pinça\n  front.push({ at: 0, text: \"Circunferência do rolo (π × d), contada da borda frontal sem somar a pinça, como na Tabela de manchas\", short: \"circunferência π × d\", pure: true });\n  if (!isNaN(P.imgR)) rear.push({ at: P.imgR, text: \"Borda traseira da imagem (causa 3)\", short: \"borda traseira da imagem\" });\n  if (!isNaN(P.c4)) rear.push({ at: P.c4, text: \"Fim do contato com a chapa, na entrada da boca (causa 4)\", short: \"entrada da boca\" });\n  const merge = list => list.reduce((acc, e) => {\n    const same = acc.find(x => Math.abs(x.at - e.at) < 0.05);\n    if (same) { same.text += \" e \" + e.text.charAt(0).toLowerCase() + e.text.slice(1); same.short += \" e \" + e.short; }\n    else acc.push({ ...e });\n    return acc;\n  }, []);\n  const out = [];\n  merge(front).forEach(e => {\n    for (let k = 1; ; k++) {\n      const v = e.at + k * circ;\n      if (v > P.Ls + limit) break;\n      out.push({ v, k, next: false, why: e.text, short: e.short,\n        calc: e.pure ? `${k} × ${mm(circ)} = ${mm(v)} mm (circunferência ${circTxt})`\n          : `${mm(e.at)} + ${k} × ${mm(circ)} = ${mm(v)} mm (circunferência ${circTxt})` });\n    }\n  });\n  merge(rear).forEach(e => {\n    for (let k = 1; k < 40; k++) {\n      const v = e.at + k * circ - PLATE_CIRC;\n      if (v > P.Ls + limit) break;\n      if (v < -limit) continue;\n      out.push({ v, k, next: true, why: e.text, short: e.short,\n        calc: `${mm(e.at)} + ${k} × ${mm(circ)} − ${mm(PLATE_CIRC)} = ${mm(v)} mm (circunferência ${circTxt})` });\n    }\n  });\n  return out.sort((x, y) => x.v - y.v);\n}\n\n// Faixas que se repetem pela folha: compara a distância entre elas com a circunferência dos rolos\nfunction periodicHtml(P) {\n  if (!(P.rep > 0)) return \"\";\n  const tol = v => Math.min(TOL, Math.max(1, v * 0.1));\n  const list = [...periodicList(), ...(VARIANT.rep || [])].map(p => ({ ...p, d: P.rep - p.mm })).filter(p => Math.abs(p.d) <= tol(p.mm))\n    .sort((a, b) => Math.abs(a.d) - Math.abs(b.d));\n  TRANSMIT.forEach(id => {\n    const c = Math.PI * R[id].d;\n    if (Math.abs(P.rep - c) <= TOL) list.push({ mm: c, d: P.rep - c, roller: id, text: `${roleName(R[id])}, impacto transmitido pelo molhador (π × ${fmt(R[id].d)})` });\n  });\n  const item = p => {\n    const ex = Math.abs(p.d) <= 0.5;\n    return `<li><button class=\"cause${ex ? \" exact\" : \"\"}\" ${p.roller ? `data-roller=\"${p.roller}\"` : \"\"}>\n      <span class=\"val\">${mm(p.mm)}<small>mm<\/small><\/span>\n      <span><strong>${p.text}<\/strong><span class=\"why\">Faixas repetidas a cada ${mm(p.mm)} mm<\/span>\n        <span class=\"kind\">${p.roller ? \"Circunferência do rolo\" : \"Engrenagem\"}<\/span><\/span>\n      <span class=\"diff\">${ex ? \"exato\" : (p.d > 0 ? \"+\" : \"−\") + mm(Math.abs(p.d)) + \" mm\"}<\/span><\/button><\/li>`;\n  };\n  return `<h3>Faixas repetidas a cada ${mm(P.rep)} mm<\/h3>` + (list.length\n    ? `<ol class=\"causes\">${list.map(item).join(\"\")}<\/ol>`\n    : `<p class=\"hint\">Nenhum rolo que toca a chapa tem esse passo. Referências: ${periodicList().concat(TRANSMIT.map(id => ({ mm: Math.PI * R[id].d, text: roleName(R[id]) }))).map(p => `${p.text.replace(/ \\(.*$/, \"\")} ${mm(p.mm)} mm`).join(\"; \")}.<\/p>`);\n}\n\nfunction diagnose() {\n  const box = document.getElementById(\"diagOut\");\n  const P = readParams(), L = P.L, pos = P.pos;\n  const periodic = periodicHtml(P);\n  if (!(L > 0) || !(pos >= 0)) {\n    box.innerHTML = periodic || `<p class=\"err\">Informe o comprimento da folha e a altura da mancha em mm, ou a distância entre faixas repetidas.<\/p>`;\n    return;\n  }\n  if (pos > L) {\n    box.innerHTML = `<p class=\"err\">A altura da mancha (${mm(pos)} mm) passa do comprimento da folha (${mm(L)} mm).<\/p>`;\n    return;\n  }\n  const found = [];\n  const off = [];\n  FORM_ROLLERS.forEach(id => {\n    const o = R[id];\n    if (!contactsOf(R.chapa).includes(o)) { off.push(roleName(o)); return; }\n    streaksFor(o, P, TOL).forEach(m => found.push({ o, v: m.v,\n      title: `${roleName(o)}: ${ord(m.k)}${m.next ? \", na folha seguinte\" : \"\"}`, why: m.why, calc: m.calc,\n      kind: id === DAMP ? \"Molhador na chapa\" : \"Entintador na chapa\", hop: 1 }));\n  });\n  TRANSMIT.forEach(id => {\n    const t = transmittedFor(id, P, TOL);\n    if (!t.linked) return;\n    t.marks.forEach(m => found.push({ o: R[id], v: m.v,\n      title: `${roleName(R[id])}: ${ord(m.k)}${m.next ? \", na folha seguinte\" : \"\"}`, why: m.why, calc: m.calc,\n      kind: \"Impacto transmitido pelo molhador\", hop: 2 }));\n  });\n  gapStreaks(P).filter(g => !g.hidden).forEach(g => found.push({ o: null, gap: g.code, v: g.v, title: `Listra de boca ${g.code}`, why: g.text,\n    calc: g.calc, kind: \"Boca dos cilindros\", hop: 0 }));\n  // listras próprias da variação (tabelas do treinamento): valor fixo ou faixa\n  (VARIANT.extra || []).forEach(x => {\n    const v = Math.min(x.to, Math.max(x.from, pos));\n    found.push({ o: null, v, title: x.title, why: x.text, kind: x.kind, hop: 3,\n      calc: x.from === x.to ? `Valor do treinamento: ${mm(x.from)} mm` : `Faixa do treinamento: ${mm(x.from)} a ${mm(x.to)} mm` });\n  });\n\n  const hits = found.map(f => ({ ...f, d: f.v - pos }))\n    .filter(f => Math.abs(f.d) <= TOL + 1e-9)\n    .sort((a, b) => Math.abs(a.d) - Math.abs(b.d) || a.hop - b.hop);\n  const exact = hits.filter(h => Math.abs(h.d) <= 0.5), near = hits.filter(h => Math.abs(h.d) > 0.5);\n\n  const item = h => {\n    const ex = Math.abs(h.d) <= 0.5;\n    const diff = ex ? \"exato\" : (h.d > 0 ? \"+\" : \"−\") + mm(Math.abs(h.d)) + \" mm\";\n    return `<li><button class=\"cause${ex ? \" exact\" : \"\"}\" ${h.o ? `data-roller=\"${h.o.id}\"` : h.gap ? `data-gap=\"${h.gap}\"` : \"\"}>\n      <span class=\"val\">${mm(h.v)}<small>mm<\/small><\/span>\n      <span><strong>${h.title}<\/strong><span class=\"why\">${h.why}<\/span>\n        <span class=\"calc\">${h.calc}<\/span><span class=\"kind\">${h.kind}<\/span><\/span>\n      <span class=\"diff\">${diff}<\/span><\/button><\/li>`;\n  };\n  const rollersHit = [...new Set(hits.filter(h => h.o).map(h => h.o))];\n  let html = `<p class=\"summary\">Mancha a <strong>${mm(pos)} mm<\/strong> da borda frontal, numa folha de ${mm(L)} mm. Faixa analisada: ${mm(pos - TOL)} a ${mm(pos + TOL)} mm. `;\n  html += hits.length ? `${hits.length} ${hits.length === 1 ? \"causa possível\" : \"causas possíveis\"}${rollersHit.length ? `, envolvendo ${rollersHit.length} ${rollersHit.length === 1 ? \"rolo\" : \"rolos\"} (destacados no esquema)` : \"\"}. Toque numa causa para ver o rolo.<\/p>`\n    : `Nenhuma causa calculada nessa faixa.<\/p><p class=\"hint\">Confira a medida a partir da borda frontal, o comprimento da folha e as posições de Entintadores, Molha e Intermediário. Também vale conferir o Vario do molhador e as bordas da imagem.<\/p>`;\n  if (off.length) html += `<p class=\"hint\">Fora da análise por estarem afastados da chapa agora: ${off.join(\", \")}.<\/p>`;\n  html += periodic;\n  const masterBlock = masterHtml(pos);\n  if (exact.length) html += `<h3>Valor exato<\/h3><ol class=\"causes\">${exact.map(item).join(\"\")}<\/ol>`;\n  if (near.length) html += `<h3>Até ${TOL} mm de diferença<\/h3><ol class=\"causes\">${near.map(item).join(\"\")}<\/ol>`;\n  html += masterBlock;\n  html += `<p class=\"note\">Se a listra continua com a rolaria bem ajustada, a Heidelberg indica retícula auxiliar geométrica (círculos ou losangos com 40 a 50 % de cobertura) na borda frontal, entre a borda do papel e o início da impressão e passando além do início da imagem. Com margem, repita na borda traseira. Fora do formato também funciona, mas suja o cilindro de impressão.<\/p>`;\n  box.innerHTML = html;\n\n  box.querySelectorAll(\"[data-roller]\").forEach(b => b.addEventListener(\"click\", () => {\n    const o = R[b.dataset.roller];\n    if (selected !== o) select(o); else drawSheet(o);\n    flash([o.id]);\n  }));\n  box.querySelectorAll(\"[data-gap]\").forEach(b => b.addEventListener(\"click\", () => {\n    flash([\"chapa\", \"blanqueta\", \"impressao\"]);\n    drawSheet(null, b.dataset.gap);\n  }));\n  flash(rollersHit.map(o => o.id));\n  drawSheet(selected);\n}\n/* Folha com as marcas do rolo selecionado */\n/* Impacto transmitido: quando o molhador bate na entrada ou saída da boca da chapa,\n   o choque passa para os rolos que encostam nele. A marca fica nesses rolos, volta ao\n   contato com o molhador a cada giro deles e percorre o molhador até a chapa. */\nconst TRANSMIT = M.transmit;\nconst TSHORT = Object.fromEntries(TRANSMIT.map(id => [id, shortName(id)]));\nconst TLIST = () => joinE(TRANSMIT.map(id => \"ao \" + TSHORT[id]));\nconst GREEN = \"#0E9F3E\", GREEN_TXT = \"#0A6E2B\";\n// percurso na superfície do 16, do contato com o rolo x até o contato com a chapa.\n// O 16 rola contra a chapa: com a chapa girando para frente (anti-horário), ele gira no sentido horário.\nfunction arcOn14(x) {\n  const w = R[DAMP], a = mod(deg(w, R.chapa) - deg(w, x), 360);\n  return a / 360 * Math.PI * w.d;\n}\nfunction transmittedFor(xId, P, limit = 0) {\n  const x = R[xId], w = R[DAMP];\n  const linked = contactsOf(w).includes(x) && contactsOf(R.chapa).includes(w);\n  const circ = Math.PI * x.d, arc = arcOn14(x);\n  const out = [];\n  const evs = [\n    { at: P.c1, rear: false, short: \"impacto do molhador na saída da boca\", code: \"saída\",\n      text: \"Impacto do molhador na saída da boca da chapa, transmitido ao \" + TSHORT[xId] },\n    { at: P.c4, rear: true, short: \"impacto do molhador na entrada da boca\", code: \"entrada\",\n      text: \"Impacto do molhador na entrada da boca da chapa, transmitido ao \" + TSHORT[xId] }\n  ];\n  evs.forEach(e => {\n    if (isNaN(e.at)) return;\n    for (let k = 1; k < 40; k++) {\n      const v = e.at + arc + k * circ - (e.rear ? PLATE_CIRC : 0);\n      if (v > P.Ls + limit) break;\n      if (v < -limit) continue;\n      out.push({ v, k, next: e.rear, why: e.text, short: e.short, code: e.code,\n        calc: `${mm(e.at)} + ${mm(arc)} (percurso no ${LBL(DAMP)}) + ${k} × ${mm(circ)}${e.rear ? ` − ${mm(PLATE_CIRC)}` : \"\"} = ${mm(v)} mm (circunferência π × ${fmt(x.d)})` });\n    }\n  });\n  return { linked, arc, circ, marks: out.sort((m, n) => m.v - n.v) };\n}\nconst greenMarks = (xId, P) => transmittedFor(xId, P).marks.filter(m => m.v >= 0 && m.v <= P.Ls)\n  .map(m => ({ v: m.v, color: \"green\", label: `${mm(m.v)} mm`,\n    sub: `${TSHORT[xId]}, ${ord(m.k)}${m.next ? \" (folha seguinte)\" : \"\"}, ${m.short}` }));\n\n/* Folha com as marcas do rolo selecionado */\nconst sheetState = { layered: false, layer: 0 };\nfunction drawSheet(o, onlyGap) {\n  const box = document.getElementById(\"sheetMap\");\n  if (!box || !manchasOn) return;\n  const P = readParams(), L = P.Ls;\n  let marks = [], title, note = \"\";\n  if (o && FORM_ROLLERS.includes(o.id)) {\n    title = `Onde o ${roleName(o).replace(\"Rolo\", \"rolo\")} marca a folha`;\n    marks = streaksFor(o, P).filter(m => m.v >= 0 && m.v <= L)\n      .map(m => ({ v: m.v, label: `${mm(m.v)} mm`, sub: `${ord(m.k)}${m.next ? \" (folha seguinte)\" : \"\"}, ${m.short}` }));\n    if (o.id === DAMP) {\n      TRANSMIT.forEach(id => { if (transmittedFor(id, P).linked) marks.push(...greenMarks(id, P)); });\n      title = `Onde o rolo ${LBL(DAMP)} (molhador) marca a folha, com o impacto transmitido ${TLIST()}`;\n    }\n    if (!contactsOf(R.chapa).includes(o)) note = \"Este rolo está afastado da chapa agora. As marcas mostram onde ele marcaria quando encostado.\";\n  } else if (o && TRANSMIT.includes(o.id)) {\n    const t = transmittedFor(o.id, P);\n    title = `Onde o ${roleName(o).replace(\"Rolo\", \"rolo\")} marca a folha pelo impacto do molhador`;\n    marks = greenMarks(o.id, P);\n    if (!t.linked) note = `Agora ele não está ligado à chapa pelo molhador ${LBL(DAMP)} (molha desligada ou ${LBL(DAMP)} afastado). As marcas mostram onde ele marcaria com o contato.`;\n  } else if (onlyGap || (o && GAP_BY_CYL[o.id])) {\n    const codes = onlyGap ? [onlyGap] : GAP_BY_CYL[o.id];\n    title = onlyGap ? `Listra de boca ${onlyGap}` : `Listras de boca ligadas ao ${o.name.toLowerCase()}`;\n    marks = gapStreaks(P).filter(g => !g.hidden && codes.includes(g.code) && g.v >= 0 && g.v <= L)\n      .map(g => ({ v: g.v, label: `${mm(g.v)} mm`, sub: `${g.code}, ${g.text.replace(/ \\(.*\\)/, \"\").toLowerCase()}` }));\n  } else {\n    box.innerHTML = o\n      ? `<p class=\"hint\"><strong>${o.name || roleName(o)}<\/strong> não toca a chapa nem os cilindros, então não marca o impresso diretamente: só transfere tinta ou água para os outros rolos. ${touchList()}.<\/p>`\n      : `<p class=\"hint\">${touchList()} para ver onde ele marca a folha.<\/p>`;\n    return;\n  }\n  sheetState.layer = 0;\n  paintSheet(box, P, title, marks, note);\n}\n\n// agrupa faixas que coincidem (a menos de 12 mm uma da outra)\nfunction clusters(marks) {\n  const sorted = [...marks].sort((a, b) => a.v - b.v), groups = [];\n  sorted.forEach(m => {\n    const g = groups[groups.length - 1];\n    if (g && m.v - g[g.length - 1].v < 12) g.push(m); else groups.push([m]);\n  });\n  return groups;\n}\n\nfunction paintSheet(box, P, title, marks, note = \"\") {\n  Object.assign(sheetState, { box, P, title, marks, note });\n  const L = P.Ls;\n  const groups = clusters(marks), layers = Math.max(1, ...groups.map(g => g.length));\n  const hasOverlap = layers > 1;\n  if (!hasOverlap) sheetState.layered = false;\n  if (sheetState.layer >= layers) sheetState.layer = 0;\n  const shown = !sheetState.layered ? marks\n    : groups.flatMap(g => g.length === 1 ? g : (g[sheetState.layer] ? [g[sheetState.layer]] : []));\n\n  // desenho em mm: largura ilustrativa do formato máximo da variação\n  const W = VARIANT.fw, ML = 30, MR = 30, MT = 70, MB = 70, fs = 26;\n  const y = v => MT + (L - v);   // borda frontal embaixo, como nos slides\n  let svgs = `<svg viewBox=\"0 0 ${W + ML + MR} ${L + MT + MB}\" role=\"img\" aria-label=\"${title}\" style=\"width:100%;height:auto;display:block\">`;\n  svgs += `<rect x=\"${ML}\" y=\"${MT}\" width=\"${W}\" height=\"${L}\" fill=\"#F2F4F5\" stroke=\"#13304D\" stroke-width=\"3\"/>`;\n  if (!isNaN(P.imgF) && !isNaN(P.imgR) && P.imgR > P.imgF)\n    svgs += `<rect x=\"${ML + 120}\" y=\"${y(Math.min(P.imgR, L))}\" width=\"${W - 240}\" height=\"${Math.min(P.imgR, L) - P.imgF}\" fill=\"#F7D4D6\"/>`;\n  if (!isNaN(P.c1) && P.c1 > 0) svgs += `<rect x=\"${ML}\" y=\"${y(P.c1)}\" width=\"${W}\" height=\"${P.c1}\" fill=\"#D5DBE0\"/>`;\n  svgs += `<text x=\"${ML + W / 2}\" y=\"${MT + L + 44}\" text-anchor=\"middle\" font-family=\"Barlow, Arial, sans-serif\" font-size=\"${fs}\" fill=\"#4B6177\">Borda frontal (0 mm)<\/text>`;\n  svgs += `<text x=\"${ML + W / 2}\" y=\"${MT - 22}\" text-anchor=\"middle\" font-family=\"Barlow, Arial, sans-serif\" font-size=\"${fs}\" fill=\"#4B6177\">Borda traseira (${mm(L)} mm)<\/text>`;\n  if (P.pos >= 0 && P.pos <= L) {\n    svgs += `<line x1=\"${ML}\" x2=\"${ML + W}\" y1=\"${y(P.pos)}\" y2=\"${y(P.pos)}\" stroke=\"#13304D\" stroke-width=\"3\" stroke-dasharray=\"14 8\"/>`;\n    svgs += `<text x=\"${ML + W - 12}\" y=\"${y(P.pos) + fs + 6}\" text-anchor=\"end\" font-family=\"Barlow, Arial, sans-serif\" font-size=\"${fs - 4}\" fill=\"#13304D\">mancha informada ${mm(P.pos)} mm<\/text>`;\n  }\n  // barras; o valor em mm fica logo acima de cada barra, em colunas para não encavalar\n  const sorted = [...shown].sort((a, b) => b.v - a.v);\n  sorted.forEach(m => svgs += `<rect x=\"${ML}\" y=\"${y(m.v) - 4}\" width=\"${W}\" height=\"8\" fill=\"${m.color === \"green\" ? GREEN : \"#E30613\"}\"/>`);\n  const cols = [ML + 14, ML + 280, ML + 546, ML + 812], colPrev = cols.map(() => -Infinity), lh = fs + 8;\n  sorted.forEach(m => {\n    const yy = y(m.v), want = yy - 10;\n    let c = colPrev.findIndex(p => want - lh >= p);\n    let ly = want;\n    if (c < 0) { c = colPrev.indexOf(Math.min(...colPrev)); ly = colPrev[c] + lh; }\n    colPrev[c] = ly;\n    svgs += `<text x=\"${cols[c]}\" y=\"${ly}\" font-family=\"Barlow, Arial, sans-serif\" font-weight=\"700\" font-size=\"${fs + 4}\" fill=\"${m.color === \"green\" ? GREEN_TXT : \"#B00010\"}\" paint-order=\"stroke\" stroke=\"#F2F4F5\" stroke-width=\"7\">${m.label}<\/text>`;\n  });\n  svgs += `<\/svg>`;\n  const legend = sorted.length ? `<ol class=\"marklist\">${[...sorted].sort((a, b) => a.v - b.v).map(m =>\n    `<li><span class=\"sw\" style=\"background:${m.color === \"green\" ? GREEN : \"#E30613\"}\"><\/span><strong>${m.label}<\/strong><span>${m.sub}<\/span><\/li>`).join(\"\")}<\/ol>` : \"\";\n\n  const hasGreen = marks.some(m => m.color === \"green\"), hasRed = marks.some(m => m.color !== \"green\");\n  const controls = `<div class=\"overlap\">\n      <button id=\"ovBtn\" aria-pressed=\"${sheetState.layered}\" ${hasOverlap ? \"\" : \"disabled\"}>${sheetState.layered ? \"Mostrar todas as faixas\" : \"Tirar sobreposição\"}<\/button>\n      ${sheetState.layered ? `<button id=\"ovPrev\">Anterior<\/button><span>Faixas sobrepostas: ${sheetState.layer + 1} de ${layers}<\/span><button id=\"ovNext\">Próxima<\/button>` : \"\"}\n      ${hasOverlap ? \"\" : `<span class=\"hint\" style=\"margin:0\">Nenhuma faixa sobreposta.<\/span>`}\n    <\/div>`;\n  box.innerHTML = `<h3>${title}<\/h3>${note ? `<p class=\"hint\">${note}<\/p>` : \"\"}\n    ${marks.length ? controls : `<p class=\"hint\">Nenhuma marca cai dentro de uma folha de ${mm(L)} mm.<\/p>`}${svgs}${legend}\n    <p class=\"hint\">${hasRed ? \"Vermelho: impacto direto. \" : \"\"}${hasGreen ? `Verde: impacto do molhador ${LBL(DAMP)} transmitido ${TLIST()}. ` : \"\"}Faixa cinza: pinça. Área rosada: imagem. Largura da folha apenas ilustrativa.<\/p>`;\n  const rerender = () => paintSheet(box, P, title, marks, note);\n  const ov = box.querySelector(\"#ovBtn\");\n  if (ov) ov.addEventListener(\"click\", () => { sheetState.layered = !sheetState.layered; sheetState.layer = 0; rerender(); });\n  const pv = box.querySelector(\"#ovPrev\"), nx = box.querySelector(\"#ovNext\");\n  if (pv) pv.addEventListener(\"click\", () => { sheetState.layer = (sheetState.layer - 1 + layers) % layers; rerender(); });\n  if (nx) nx.addEventListener(\"click\", () => { sheetState.layer = (sheetState.layer + 1) % layers; rerender(); });\n}\n\n/* Pontos vermelhos de impacto: presos à chapa (no contato chapa–blanqueta) e ao papel\n   (no contato blanqueta–impressão) no momento de cada evento */\nconst impactMarks = {};\nconst pulseLayer = el(\"g\", { \"pointer-events\": \"none\" }, svg);\nlet prevX = null;\nfunction markOn(o, worldDeg, radius, label, list) {\n  const a = (worldDeg - o.angle) * Math.PI / 180;\n  const g = el(\"g\", { transform: `translate(${(Math.cos(a) * radius).toFixed(2)} ${(Math.sin(a) * radius).toFixed(2)})` }, o.rot);\n  el(\"circle\", { r: 9, fill: \"#E30613\", stroke: \"#fff\", \"stroke-width\": 2.5 }, g);\n  const t = el(\"text\", { x: 13, y: -11, fill: \"#E30613\", \"font-family\": \"Barlow, Arial, sans-serif\", \"font-weight\": 700,\n    \"font-size\": 15, \"paint-order\": \"stroke\", stroke: \"#fff\", \"stroke-width\": 4 }, g);\n  t.textContent = label;\n  li
