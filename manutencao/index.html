<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manutenção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFEE; --panel:#FAFBFA; --panel2:#E3E6E4; --line:#D0D5D2; --ink:#151917; --muted:#5D6661;
  --g:#1D5238; --g2:#2C6B4B; --gsoft:#DCEBE2; --onG:#FFFFFF;
  --y:#A87C00; --ysoft:#FBF0CC; --ybd:#D9AE1E;
  --red:#B3261E; --rsoft:#F7DEDB;
  --blue:#1F5FA8; --bsoft:#DDE8F6;
  --gray1:#A9B0AC;
  --r:10px;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fc:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111413; --panel:#1A1E1C; --panel2:#232826; --line:#313835; --ink:#E5E9E7; --muted:#97A19B;
    --g:#3E8A62; --g2:#4E9C73; --gsoft:#1C3227; --y:#E0B53A; --ysoft:#3A3112; --ybd:#B8901A; --red:#E5675E; --rsoft:#3D1D1A; --blue:#6AA6E8; --bsoft:#1B2A3D; --gray1:#4A524E;
  }
}
:root[data-theme="dark"]{
  --bg:#111413; --panel:#1A1E1C; --panel2:#232826; --line:#313835; --ink:#E5E9E7; --muted:#97A19B;
  --g:#3E8A62; --g2:#4E9C73; --gsoft:#1C3227; --y:#E0B53A; --ysoft:#3A3112; --ybd:#B8901A; --red:#E5675E; --rsoft:#3D1D1A; --blue:#6AA6E8; --bsoft:#1B2A3D; --gray1:#4A524E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top h1{font-family:var(--fc);font-weight:700;font-size:26px;margin:0;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.top .sub{display:block;font-family:var(--fb);font-weight:500;font-size:13px;color:var(--muted)}
.back{border:0;background:transparent;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;margin-left:-8px;flex:none}
.back:active{background:var(--panel2)}
.ic{width:26px;height:26px}
.muted{color:var(--muted)}

/* home */
.brand{display:flex;align-items:center;gap:12px;padding:26px 0 18px}
.brand .logo{width:46px;height:46px;border-radius:10px;background:var(--g);color:var(--onG);display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--fc);font-size:38px;font-weight:700;margin:0;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pcard{display:block;width:100%;text-align:left;background:#151917;color:#fff;border:0;border-radius:var(--r);padding:16px}
.pcard .row{display:flex;align-items:baseline;gap:10px}
.pcard b{font-family:var(--fc);font-size:26px;font-weight:700;flex:1;line-height:1.1}
.pcard .pc{font-family:var(--fc);font-size:30px;font-weight:700}
.pcard small{display:block;color:#B9C2BD;font-size:13px;margin-top:2px}
.pcard .thin{margin-top:12px;background:#2B312E;border-color:#2B312E}
.pcard .thin i{background:#4E9C73}
.pcard .cnts{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:600;flex-wrap:wrap}
.dotc{display:inline-flex;align-items:center;gap:6px}
.dotc i{width:9px;height:9px;border-radius:50%;display:inline-block}
.switchplan{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.switchplan span{font-size:13px;font-weight:600;color:var(--muted)}
.homegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 10px 10px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile:active{transform:translateY(1px)}
.tile{min-width:0}.tile b{font-family:var(--fc);font-size:18px;font-weight:600;line-height:1.1}
.tile .soon{font-size:11px;font-weight:600;color:var(--muted)}
.thin{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.thin i{display:block;height:100%;background:var(--g)}
.h2{font-family:var(--fc);font-weight:600;font-size:17px;color:var(--muted);margin:24px 0 8px;display:flex;align-items:center;justify-content:space-between}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}
.linkbtn{border:0;background:transparent;font-weight:600;font-size:14px;color:var(--g);padding:6px 0;display:inline-flex;align-items:center;gap:4px;text-align:left;justify-content:flex-start}
.linkbtn svg{width:18px;height:18px}

/* history */
.hist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.hrow{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow .hi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel2)}
.hrow .hi svg{width:15px;height:15px}
.hrow .hi.ok{background:var(--gsoft);color:var(--g)}
.hrow .hi.bad{background:var(--rsoft);color:var(--red)}
.hrow p{margin:0;line-height:1.35}
.hrow small{display:block;color:var(--muted);font-size:12.5px}

/* plans */
.plan{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;margin-bottom:10px}
.plan .hd{display:flex;align-items:flex-start;gap:8px}
.plan .hd b{font-family:var(--fc);font-size:23px;font-weight:600;flex:1;line-height:1.15}
.plan p{margin:2px 0 0;color:var(--muted);font-size:14px}
.plan .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;background:var(--panel2);border-radius:20px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tag.cur{background:var(--gsoft);color:var(--g)}
.newplan{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* dashboard */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;margin-top:6px}
.big{display:flex;align-items:flex-end;gap:12px}
.big .n{font-family:var(--fc);font-weight:700;font-size:72px;line-height:.85;letter-spacing:-1px}
.big .n small{font-size:36px;font-weight:600;margin-left:2px}
.big .t{padding-bottom:4px;font-size:14px;color:var(--muted);line-height:1.3}
.big .t b{color:var(--ink);font-weight:600}
.bar{position:relative;height:16px;margin:16px 0 4px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--g);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(127,127,127,.28) calc(10% - 1px) 10%)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(5,1fr);margin-top:18px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.patch{border:0;background:transparent;padding:0;display:flex;flex-direction:column;border-right:1px solid var(--line);text-align:center}
.patch:last-child{border-right:0}
.patch .well{position:relative;height:70px;background:var(--panel2)}
.patch .fill{position:absolute;left:0;right:0;bottom:0;background:var(--g);transition:height .5s cubic-bezier(.2,.7,.2,1)}
.patch .pct{position:absolute;left:0;right:0;top:6px;font-family:var(--fc);font-weight:700;font-size:20px;line-height:1}
.patch .lb{font-size:12px;font-weight:600;padding:6px 2px;background:var(--panel)}
.patch[aria-pressed="true"] .lb{background:var(--ink);color:var(--bg)}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 15px;position:relative;overflow:hidden}
.st::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sc)}
.st .v{font-family:var(--fc);font-weight:700;font-size:28px;line-height:1}
.st .l{font-size:13px;font-weight:600;margin-top:3px}
.st .c{font-size:12px;color:var(--muted)}
.now{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px}
.nr:last-child{border-bottom:0}
.nr .tx{flex:1;min-width:0}
.nr b{font-family:var(--fc);font-weight:600;font-size:19px;display:block;line-height:1.15}
.nr span{font-size:13px;color:var(--muted)}
.nr .cnt{text-align:right;font-family:var(--fc);font-weight:600;font-size:19px;line-height:1.1}
.nr .cnt small{display:block;font-family:var(--fb);font-weight:600;font-size:12px;color:var(--muted)}
.nr .cnt small.bad{color:var(--red)}
.ring{width:34px;height:34px;flex:none}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cta{display:block;width:100%;border:0;border-radius:var(--r);background:var(--g);color:var(--onG);font-family:var(--fc);font-weight:600;font-size:20px;padding:14px}
.cta.sec{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.settings{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.setr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.setr:last-child{border-bottom:0}
.setr label,.setr .k{flex:1;min-width:120px;font-weight:600}
.setr .v{color:var(--muted)}
.setr input,.setr select{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.sync{font-size:12px;color:var(--muted);margin-top:8px}

/* list */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px;font-size:14px}
.toggle{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 0;font-weight:600;font-size:14px}
.sw2{width:38px;height:22px;border-radius:11px;background:var(--gray1);position:relative;transition:background .2s;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
[aria-pressed="true"] > .sw2,[aria-checked="true"] > .sw2{background:var(--g)}
[aria-pressed="true"] > .sw2::after,[aria-checked="true"] > .sw2::after{left:19px}
.sec{margin-top:18px}
.sech{display:flex;align-items:baseline;gap:10px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.sech h3{font-family:var(--fc);font-weight:700;font-size:22px;margin:0;flex:1}
.sech span{font-size:13px;color:var(--muted);font-weight:500}
.sech.bad{border-color:var(--red)}
.sech.bad h3{color:var(--red)}
.grp{font-size:13px;font-weight:600;color:var(--muted);padding:12px 2px 4px}
.it{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ck{width:44px;height:44px;border-radius:8px;border:2px solid var(--ybd);background:var(--ysoft);display:grid;place-items:center;transition:background .15s,border-color .15s;color:var(--y)}
.ck svg{width:24px;height:24px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.ck[aria-checked="true"]{background:var(--g);border-color:var(--g);color:var(--onG)}
.ck[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.ck.venc[aria-checked="false"]{border-color:var(--red);background:var(--rsoft);color:var(--red)}
.ck.lock svg.lk{opacity:1;transform:none;width:18px;height:18px}
.it .open{border:0;background:transparent;text-align:left;padding:2px 0 0;min-width:0;display:block;width:100%}
.it .open p{margin:0;font-weight:500;font-size:15.5px;line-height:1.35}
.it.done .open p{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.meta .okt{color:var(--g);font-weight:600}
.meta .yt{color:var(--y);font-weight:600}
.meta .rt{color:var(--red);font-weight:600}
.flag{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink)}
.flag svg{width:14px;height:14px}
.fa,.fa svg{color:var(--red)}
.ft,.ft svg{color:var(--blue)}
.pill.fa{border-color:var(--red);background:var(--rsoft)}
.pill.ft{border-color:var(--blue);background:var(--bsoft)}
.ic-a{color:var(--red)}.ic-t{color:var(--blue)}
.tb .nm .ics{display:inline-flex;gap:3px;margin-left:4px;vertical-align:-2px}
.tb .nm .ics svg{margin-left:0}
.hrow .hi.tr{background:var(--bsoft);color:var(--blue)}
.vseg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vseg button{border:0;background:var(--panel);padding:6px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.vseg button+button{border-left:1px solid var(--line)}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.vseg svg{width:16px;height:16px}
.tbbar{display:flex;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.tbbar label{font-size:13px;font-weight:600;color:var(--muted)}
.tbbar select{font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:12px;height:12px;border-radius:50%;border:2px solid;display:inline-block}
.tbwrap{overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.tb{border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:100%}
.tb th,.tb td{padding:0;border-bottom:1px solid var(--line)}
.tb thead th{background:var(--g);color:var(--onG);font-size:13px;font-weight:600;padding:8px 4px;text-align:center;white-space:nowrap;line-height:1.15;min-width:46px}
.tb thead th small{display:block;font-size:11px;font-weight:500;opacity:.8}
.tb thead th.cur{background:var(--ink);color:var(--bg)}
.tb thead th:first-child{background:var(--panel);color:var(--muted);text-align:left;padding-left:12px;border-top-left-radius:var(--r)}
.tb thead th:last-child{border-top-right-radius:var(--r)}
.tb .nm{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;min-width:148px;max-width:200px;border-right:1px solid var(--line)}
.tb .nm button{border:0;background:transparent;text-align:left;padding:9px 10px 9px 12px;font-size:13.5px;font-weight:500;line-height:1.3;width:100%}
.tb .nm svg{width:13px;height:13px;vertical-align:-2px;margin-left:3px}
.tb tr.gr td{background:var(--panel2);font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 12px}
.tb tr.gr td.nm{background:var(--panel2)}
.tb td.c{text-align:center;padding:4px 4px}
.tb td.c.cur{background:var(--panel2)}
.tb tbody tr:last-child td{border-bottom:0}
.cb{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:inline-grid;place-items:center;padding:0;color:var(--onG);vertical-align:middle}
.cb svg{width:16px;height:16px}
.cb.feita{background:var(--g);border-color:var(--g)}
.cb.pendente{border-color:var(--ybd);background:var(--ysoft)}
.cb.vencida{border-color:var(--red);background:var(--rsoft)}
.cb.futura{border-color:var(--line)}
.pre{color:var(--gray1);font-size:13px}
.alldone{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px;font-size:14px;color:var(--muted)}

/* cards, detail */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dtitle{font-family:var(--fc);font-weight:700;font-size:28px;line-height:1.15;margin:0 0 8px;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:2px 10px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pill.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.ok{background:var(--gsoft);color:var(--g);border-color:transparent}
.pill svg{width:13px;height:13px}
.alertbox{display:flex;gap:10px;border:2px solid var(--ink);border-radius:8px;padding:12px;margin-top:14px;background:var(--panel2)}
.alertbox svg{width:22px;height:22px;flex:none;margin-top:1px}
.alertbox b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.alertbox p{margin:0;font-size:15px;white-space:pre-wrap}
.fields{margin:14px 0 0}
.f{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.f dt{color:var(--muted);font-size:13.5px;font-weight:600;padding-top:1px}
.f dd{margin:0;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.f dd small{display:block;color:var(--muted);font-size:13px}
.statusline{display:flex;align-items:center;gap:12px;margin-top:12px}
.statusline .tx{flex:1;font-size:14px}
.statusline .tx b{display:block;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border-radius:var(--r);padding:11px 14px;font-weight:600;font-size:15.5px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--g);color:var(--onG);border-color:var(--g)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:7px 12px;font-size:14px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.lockmsg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.lockmsg svg{width:16px;height:16px;flex:none}

/* rows (people, machines) */
.rows{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px}
.rw:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-family:var(--fc);font-weight:700;font-size:17px;flex:none}

/* ---------- banco local (quando o app roda fora do Claude) ---------- */
function LocalDB(key){
  let store={};try{store=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(store))}catch(e){};subs.forEach(f=>f())};
  const nseg=p=>p.split("/").length;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const snap=p=>({id:p.split("/").pop(),exists:p in store,data:()=>p in store?clone(store[p]):undefined,metadata:{}});
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a};
  function docRef(p){return{id:p.split("/").pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{store[p]=clone(d);save()},
    update:async d=>{if(!(p in store))throw{code:"invalid_argument"};merge(store[p],clone(d));save()},
    delete:async()=>{delete store[p];save()},
    onSnapshot(n){const f=()=>n(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
    collection:c=>colRef(p+"/"+c)}}
  function q(p,fl,ord,lim){
    const run=()=>{let docs=Object.keys(store).filter(k=>k.startsWith(p+"/")&&nseg(k)===nseg(p)+1).map(snap);
      fl.forEach(([f,op,v])=>{docs=docs.filter(d=>{const x=d.data()[f];return op==="=="?x===v:op==="array-contains"?Array.isArray(x)&&x.includes(v):true})});
      if(ord)docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]];return (x>y?1:x<y?-1:0)*(ord[1]==="desc"?-1:1)});else docs.sort((a,b)=>a.id<b.id?-1:1);
      if(lim)docs=docs.slice(0,lim);return{docs,size:docs.length,empty:!docs.length,metadata:{}}};
    return{where:(f,o,v)=>q(p,[...fl,[f,o,v]],ord,lim),orderBy:(f,d)=>q(p,fl,[f,d||"asc"],lim),limit:n=>q(p,fl,ord,n),get:async()=>run(),
      onSnapshot(n){const f=()=>n(run());subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
  function colRef(p){return{...q(p,[],null,0),path:p,doc:id=>docRef(p+"/"+(id||rid())),add:async d=>{const r=docRef(p+"/"+rid());await r.set(d);return r}}}
  return{doc:docRef,collection:colRef};
}

  else if(p==="w"){for(let m=0;m<12;m++){const L=new Date(Y,m+1,0).getDate();[[1,8],[9,16],[17,24],[25,L]].forEach(([a,b],k)=>o.push({id:Y+"-"+pad(m+1)+"-w"+(k+1),s:new Date(Y,m,a),e:new Date(Y,m,b),doc:Y+"-"+pad(m+1),label:a+" a "+b+" de "+MES[m]}))}}
  else if(p==="m"){for(let m=0;m<12;m++)o.push({id:Y+"-"+pad(m+1),s:new Date(Y,m,1),e:new Date(Y,m+1,0),doc:Y+"-"+pad(m+1),label:MESL[m]})}
  else if(p==="s"){o.push({id:Y+"-s1",s:new Date(Y,0,1),e:new Date(Y,5,30),doc:Y+"-01",label:"1º semestre"});o.push({id:Y+"-s2",s:new Date(Y,6,1),e:new Date(Y,11,31),doc:Y+"-07",label:"2º semestre"})}
  else o.push({id:String(Y),s:new Date(Y,0,1),e:new Date(Y,11,31),doc:Y+"-01",label:String(Y)});
  return o;
}
const chave=(it,w)=>it.id+"_"+w.id;
const janelaPorId=(p,wid)=>janelas(p,Number(wid.slice(0,4))).find(x=>x.id===wid);
const docDe=wid=>/-s1$/.test(wid)?wid.slice(0,4)+"-01":/-s2$/.test(wid)?wid.slice(0,4)+"-07":/^\d{4}$/.test(wid)?wid+"-01":wid.slice(0,7);
const inicioDe=pl=>parseYmd((pl&&pl.inicio)||inicioMes());
function inicioPlano(){return inicioDe(P())}
function janelasPlano(p,ini=inicioPlano()){const T=hoje();const ws=janelas(p,T.getFullYear()).filter(w=>w.e>=ini);return {ws,cur:ws.findIndex(w=>w.s<=T&&w.e>=T)}}
function statusDe(it,w,marks=C.marks){if(marks[chave(it,w)])return "feita";const T=hoje();if(w.s>T)return "futura";if(w.e>=T)return "pendente";return "vencida"}
/* feita (verde) | pendente: ainda não venceu (amarelo) | vencida: período terminou sem ser feita (vermelho) */
function calcFor(pl,its,marks){
  const res={},ini=inicioDe(pl);
  PKEYS.forEach(p=>{
    const pi=its.filter(i=>i.p===p),{ws,cur}=janelasPlano(p,ini);
    const r={p,its:pi,ws,cur,total:pi.length*ws.length,feita:0,pendente:0,vencida:0,futura:0};
    ws.forEach(w=>pi.forEach(it=>r[statusDe(it,w,marks)]++));
    r.devidas=r.feita+r.pendente+r.vencida;res[p]=r;
  });
  const all={total:0,feita:0,pendente:0,vencida:0,futura:0,devidas:0};
  PKEYS.forEach(p=>Object.keys(all).forEach(k=>all[k]+=res[p][k]));
  res.todas=all;return res;
}
function calc(){return calcFor(P(),IT,C.marks)}

const filas={};
function fila(id,fn){filas[id]=(filas[id]||Promise.resolve()).then(fn,fn);return filas[id]}
async function w(fn,msg){try{await fn();return true}catch(e){console.warn(e);toast(e&&e.code==="invalid_argument"?"Sem permissão para salvar. Peça acesso de colaborador no compartilhamento.":(msg||"Não foi possível salvar. Tente de novo."));return false}}
const ref=p=>db.doc(p);
function log(acao,alvo,det,pid=C.pid){if(!db||!pid)return;const id=Date.now().toString(36)+rid();fila("h",()=>w(()=>db.collection("planos/"+pid+"/historico").doc(id).set({t:Date.now(),uid:ME.uid||"local",acao,alvo:alvo||"",det:det||""})))}
function docMarks(docId){const o={};Object.keys(C.marks).forEach(k=>{if(docDe(k.slice(k.indexOf("_")+1))===docId)o[k]=C.marks[k]});return o}
function gravarMarca(k,docId,valor){
  const pid=C.pid,r=db.collection("planos/"+pid+"/meses").doc(docId);
  return fila(pid+docId,async()=>{
    try{if(C.monthDocs[docId])await r.update({f:{[k]:valor}});else{await r.set({f:{...docMarks(docId),[k]:valor}});C.monthDocs[docId]=true}}
    catch(e){if(e&&e.code==="invalid_argument"){await w(()=>r.set({f:{...docMarks(docId),[k]:valor}}))}else toast("Não foi possível salvar. Tente de novo.")}
  });
}
async function gravarItem(id,obj){C.over[id]=obj;montarItens();return fila("it"+id,()=>w(()=>db.collection("planos/"+C.pid+"/itens").doc(id).set(obj),"Não foi possível salvar o item."))}
async function atualizarPlano(pid,dados){const pl=pid==="standard"?std:planos[pid];const full={...(pl||{}),...dados};delete full.id;if(pid==="standard")std=full;else planos[pid]=full;render();return fila("pl"+pid,()=>w(()=>db.doc("planos/"+pid).set(full)))}

async function iniciar(){

  }
  if(ME.uid)db.doc("data/users/"+ME.uid+"/prefs").onSnapshot(s=>{prefs={ocultarStandard:false,...(s.exists?s.data():{})};prefsOk=true;escolherPlano();syncResumos();render()},()=>{prefsOk=true});
  db.doc("planos/standard").onSnapshot(async s=>{

      await w(()=>db.doc("planos/standard").set(std));
      await w(()=>db.doc("planos/standard/pessoas/"+ME.uid.replace(/[^\w-]/g,"")).set({uid:ME.uid,admin:true,nome:"",codigo:"",setor:"",cargo:"",criadoEm:Date.now()}));
    }
    pronto=true;escolherPlano();syncResumos();render();
  },()=>{});
  if(ME.uid)db.collection("planos").where("membros","array-contains",ME.uid).onSnapshot(sn=>{
    const o={};sn.docs.forEach(d=>{if(d.id!=="standard")o[d.id]=d.data()});planos=o;escolherPlano();syncResumos();render();
  },()=>{});
  const m=(location.hash||"").match(/^#\/convite\/([A-Z0-9]+)/i);if(m)setTimeout(()=>aceitarConvite(m[1].toUpperCase()),400);

let rq=false;function agendarRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function planosHome(){const l=planosVisiveis().map(p=>({...p,membro:true}));if(std&&!souMembro(std)&&!prefs.ocultarStandard)l.unshift({id:"standard",...std,nome:"Standard",membro:false});return l}
function syncResumos(){
  if(!db)return;
  const want=new Set(planosHome().filter(p=>p.membro).map(p=>p.id));
  Object.keys(RES).forEach(pid=>{if(!want.has(pid)){RES[pid].un.forEach(u=>{try{u()}catch(e){}});delete RES[pid]}});
  want.forEach(pid=>{if(RES[pid])return;const r=RES[pid]={over:{},marks:{},un:[],ok:0};
    r.un.push(db.collection("planos/"+pid+"/itens").onSnapshot(sn=>{const o={};sn.docs.forEach(d=>o[d.id]=d.data());r.over=o;r.ok|=1;agendarRender()},()=>{}));
    r.un.push(db.collection("planos/"+pid+"/meses").onSnapshot(sn=>{const m={};sn.docs.forEach(d=>{const f=(d.data()||{}).f||{};Object.keys(f).forEach(k=>{if(f[k])m[k]=f[k]})});r.marks=m;r.ok|=2;agendarRender()},()=>{}));
  });
}
async function salvarPrefs(nv){prefs={...prefs,...nv};escolherPlano();syncResumos();render();if(ME.uid)await w(()=>db.doc("data/users/"+ME.uid+"/prefs").set(prefs))}
function escolherPlano(){
  const vis=planosVisiveis();
  const rota=(location.hash||"").match(/^#\/(?:plano|item)\/([\w-]+)/);
  let alvo=rota&&vis.find(p=>p.id===rota[1])?rota[1]:(vis.find(p=>p.id===ui.pid)?ui.pid:(vis[0]&&vis[0].id));
  if(alvo!==C.pid)abrirPlano(alvo||null);
}
function abrirPlano(pid){
  C.unsub.forEach(u=>{try{u()}catch(e){}});
  C={pid,over:{},marks:{},monthDocs:{},pessoas:[],grupos:[],maquinas:[],pecas:[],trocas:[],hist:[],unsub:[]};
  ui.pid=pid;saveUi();
  if(!pid){render();return}
  const base="planos/"+pid;
  const sub=(path,fn,qf)=>{let q=db.collection(path);if(qf)q=qf(q);C.unsub.push(q.onSnapshot(sn=>{if(C.pid!==pid)return;fn(sn);render()},()=>{}))};
  sub(base+"/itens",sn=>{const o={};sn.docs.forEach(d=>o[d.id]=d.data());C.over=o});
  sub(base+"/meses",sn=>{const m={};C.monthDocs={};sn.docs.forEach(d=>{C.monthDocs[d.id]=true;const f=(d.data()||{}).f||{};Object.keys(f).forEach(k=>{if(f[k])m[k]=f[k]})});C.marks=m});
  sub(base+"/pessoas",sn=>{C.pessoas=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>nomePessoa(a).localeCompare(nomePessoa(b)))});
  sub(base+"/grupos",sn=>{C.grupos=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome).localeCompare(b.nome))});
  sub(base+"/maquinas",sn=>{C.maquinas=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome).localeCompare(b.nome))});
  sub(base+"/pecas",sn=>{C.pecas=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nome).localeCompare(b.nome))});
  sub(base+"/trocas",sn=>{C.trocas=sn.docs.map(d=>({id:d.id,...d.data()}))},q=>q.orderBy("t","desc").limit(300));
  sub(base+"/historico",sn=>{C.hist=sn.docs.map(d=>({id:d.id,...d.data()}))},q=>q.orderBy("t","desc").limit(300));
  render();
}

/* ---------- marcar item ---------- */
function onCheck(iid,wid){
  const it=itemPorId(iid);if(!it)return;
  const wd=janelaPorId(it.p,wid),k=chave(it,wd),m=mk(k),st=statusDe(it,wd),adm=souAdmin();
  if(!souMembro()){toast("Você não faz parte deste plano.");return}
  if(m){
    if(!adm&&m.u&&m.u!==ME.uid){toast("Só quem marcou ou um administrador pode desfazer.");return}
    confirmar("Desfazer marcação?",esc(it.d)+(m.tr?"<br>A troca registrada em Peças fica marcada como desfeita.":""),"Desfazer",()=>{delete C.marks[k];gravarMarca(k,wd.doc,null);
      if(m.tr){const tr=C.trocas.find(x=>x.id===m.tr);if(tr){const o={...tr,desfeito:true,desfeitoEm:Date.now(),desfeitoPor:ME.uid||"local"};delete o.id;w(()=>db.doc("planos/"+C.pid+"/trocas/"+m.tr).set(o))}}
      log("desfeito",it.d,PER[it.p].nome+", "+wd.label);render();toast("Marcação desfeita")});
    return;
  }
  if(st==="futura"){toast("Este período ainda não começou.");return}
  if(wd.e<inicioPlano()){toast("Período anterior ao início do acompanhamento.");return}
  if(st==="vencida"&&!adm){toast("Item vencido. Só um administrador pode marcar.");return}
  passoAlerta(it,()=>passoConfirmar(it,wd,st,(acao,obs)=>{
    const v={t:Date.now(),u:ME.uid||"local"};if(acao)v.a=acao;if(it.alerta)v.ok=1;if(obs)v.o=obs;
    if(acao==="troca"){const pc=it.peca&&C.pecas.find(x=>x.id===it.peca);const trId="t"+rid();v.tr=trId;
      const tr={t:v.t,uid:v.u,item:it.id,itemNome:it.d,peca:pc?pc.id:"",pecaNome:pc?pc.nome:"",per:it.p,janela:wd.label,obs:obs||""};
      C.trocas=[{id:trId,...tr},...C.trocas];w(()=>db.doc("planos/"+C.pid+"/trocas/"+trId).set(tr))}
    C.marks[k]=v;gravarMarca(k,wd.doc,v);
    log(st==="vencida"?"feito_vencido":"feito",it.d,PER[it.p].nome+", "+wd.label+(acao==="troca"?", trocou":acao==="limpeza"?", limpou":"")+(obs?". Obs: "+obs:""));
    render();toast(acao==="troca"?"Feito: peça trocada":acao==="limpeza"?"Feito: peça limpa":"Item marcado como feito");
  }));
}
function passoAlerta(it,next){
  if(!it.alerta)return next();
  abrirModal(`<h2><span class="ic-a" style="display:flex">${IC.alert}</span> Atenção</h2><p class="itname">${esc(it.d)}</p><div class="imp" style="border-color:var(--red)">${esc(it.obs||"Este item está sinalizado com alerta.")}</div>
    <p class="msg">Confirme que você leu e entendeu antes de marcar como feito.</p>
    <div class="btns"><button class="btn pri" data-a="ok">Entendi, marcar como feito</button><button class="btn" data-a="nao">Não entendi</button></div>`,
    a=>{fecharModal();if(a==="ok")setTimeout(next,220);else if(a==="nao"){log("alerta_nao_entendido",it.d,"");toast("Item não marcado. Fale com o responsável antes de executar.")}});
}
function passoConfirmar(it,wd,st,next){
  const pc=it.peca&&C.pecas.find(x=>x.id===it.peca);
  abrirModal(`<h2>${IC.ck} Confirmar execução</h2><p class="itname">${esc(it.d)}</p><p class="msg" style="margin-bottom:0">${PER[it.p].nome}, ${wd.label}${st==="vencida"?", período vencido":""}</p>
    ${it.troca?`<span class="lbl2">O que foi feito</span><div class="seg mseg" role="group"><button type="button" data-a="troca" aria-pressed="false">Troquei</button><button type="button" data-a="limpeza" aria-pressed="false">Limpei</button></div>
      <p class="pcinfo">${pc?`Peça associada: <b>${esc(pc.nome)}</b>${pc.codigo?", código "+esc(pc.codigo):""}. `:""}Se trocou, fica registrado no histórico de Peças.</p><div class="err" id="mse">Escolha se trocou ou limpou.</div>`:""}
    <label class="lbl2" for="mobs">Observação</label><textarea class="in" id="mobs" placeholder="Opcional: o que encontrou, ajuste feito, material usado"></textarea>
    <div class="btns two" style="margin-top:14px"><button class="btn" data-a="x">Cancelar</button><button class="btn pri" data-a="ok">Confirmar</button></div>`,
    (a,ov)=>{
      if(a==="troca"||a==="limpeza"){ov.dataset.acao=a;ov.querySelectorAll(".mseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.a===a)));ov.querySelector("#mse").classList.remove("on");return}
      if(a==="ok"){if(it.troca&&!ov.dataset.acao){ov.querySelector("#mse").classList.add("on");return}const obs=ov.querySelector("#mobs").value.trim();fecharModal();next(ov.dataset.acao||null,obs);return}
      fecharModal();
    });
}

/* ---------- modal ---------- */
let modalFoco=null;
function abrirModal(html,onAcao){
  modalFoco=document.activeElement;document.getElementById("toast").classList.remove("on");
  const m=document.getElementById("modal");
  m.insertAdjacentHTML("beforeend",`<div class="ov" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`);
  const ov=m.lastElementChild;requestAnimationFrame(()=>ov.classList.add("on"));
  ov.addEventListener("click",e=>{if(e.target===ov){fecharModal();onAcao("x");return}const b=e.target.closest("[data-a]");if(b)onAcao(b.dataset.a,ov)});
  ov.addEventListener("keydown",e=>{if(e.key==="Escape"){fecharModal();onAcao("x")}});
  const f=ov.querySelector("textarea,input,button");if(f)setTimeout(()=>f.focus(),60);
  return ov;
}
function fecharModal(){const m=document.getElementById("modal");const ov=m.lastElementChild;if(!ov||ov.dataset.fechando)return;ov.dataset.fechando="1";ov.classList.remove("on");setTimeout(()=>ov.remove(),200);if(modalFoco&&modalFoco.focus)try{modalFoco.focus()}catch(e){}}

    (a,ov)=>{if(a!=="ok"){fecharModal();return}const v=ov.querySelector("#mtx").value.trim();if(!v){ov.querySelector("#mtxe").classList.add("on");return}fecharModal();fn(v)});

async function criarPlano(nome,modelo,origem){
  if(!ME.uid){toast("Entre na sua conta Claude para criar planos.");return}
  const pid="p"+rid();
  const doc={nome,modelo:modelo||null,criadoPor:ME.uid,membros:[ME.uid],criadoEm:Date.now(),inicio:inicioMes()};
  if(origem){doc.copiaDe=origem.id;doc.copiaNome=origem.nome||""}
  if(!await w(()=>db.doc("planos/"+pid).set(doc)))return;
  planos[pid]=doc;
  await w(()=>db.doc("planos/"+pid+"/pessoas/"+ME.uid.replace(/[^\w-]/g,"")).set({uid:ME.uid,admin:true,nome:"",codigo:"",setor:"",cargo:"",criadoEm:Date.now()}));
  if(origem&&origem.copiarItens){
    const sn=await db.collection("planos/"+origem.id+"/itens").get();
    for(const d of sn.docs)await w(()=>db.collection("planos/"+pid+"/itens").doc(d.id).set(d.data()));
  }
  abrirPlano(pid);
  log("plano_criado",nome,origem?"cópia de "+(origem.nome||"outro plano"):"criado do zero",pid);
  location.hash='#/plano/'+pid;toast(origem?"Cópia criada":"Plano criado");
}
function copiarPlano(src){
  const vis=planosVisiveis();const pl=src==="standard"?(std||{}):(vis.find(p=>p.id===src)||{});
  const nomeO=src==="standard"?"Standard":(pl.nome||"Plano");
  pedirTexto("Copiar plano","Nome da cópia","Cópia de "+nomeO,"Criar cópia",v=>{
    // quem é membro do Standard leva também as edições feitas nele; os demais recebem o modelo original
    criarPlano(v,src==="standard"?"standard":(pl.modelo||null),{id:src,nome:nomeO,copiarItens:souMembro(pl)});
  });
}

}
function ordArea(a,b){const ia=AREAS.indexOf(a.g),ib=AREAS.indexOf(b.g);return (ia<0?99:ia)-(ib<0?99:ib)||a.ord-b.ord}
const vistaHtml=()=>`<div class="vseg" role="group" aria-label="Visualização"><button aria-pressed="${ui.vista==="lista"}" onclick="ui.vista='lista';saveUi();render()">${IC.lista}Lista</button><button aria-pressed="${ui.vista==="tabela"}" onclick="ui.vista='tabela';saveUi();render()">${IC.tabela}Tabela</button></div>`;
function rotuloCol(p,w){if(p==="d")return String(w.s.getDate())+`<small>${["dom","seg","ter","qua","qui","sex","sáb"][w.s.getDay()]}</small>`;if(p==="w")return "Dia "+w.e.getDate();if(p==="m"){const n=MES[w.s.getMonth()];return n[0].toUpperCase()+n.slice(1)}if(p==="s")return w.id.endsWith("s1")?"1º sem":"2º sem";return w.label}
let tabKey=null,tabScroll=0;
function telaTabela(){
  const pl=P(),adm=souAdmin(),T=hoje(),Y=T.getFullYear(),ini=inicioPlano();
  if(ui.filtro==="todas")ui.filtro="w";
  const p=ui.filtro;
  if(ui.tabMes==null)ui.tabMes=T.getMonth();
  let ws=janelas(p,Y);if(p==="d"||p==="w")ws=ws.filter(w=>w.s.getMonth()===ui.tabMes);
  const its=IT.filter(i=>i.p===p).sort(ordArea);
  const head=ws.map(w=>{const cur=w.s<=T&&w.e>=T,f=its.filter(it=>C.marks[chave(it,w)]).length;return `<th class="${cur?"cur":""}" ${cur?'id="colcur"':""}>${rotuloCol(p,w)}${p==="d"?"":`<small>${f}/${its.length}</small>`}</th>`}).join("");
  let rows="",g=null;
  its.forEach(it=>{
    if(it.g!==g){g=it.g;rows+=`<tr class="gr"><td class="nm">${esc(g)}</td><td colspan="${ws.length}"></td></tr>`}
    rows+=`<tr><td class="nm"><button onclick="location.hash='#/item/${C.pid}/${it.id}'">${esc(it.d)}${(it.alerta||it.troca)?`<span class="ics">${it.troca?`<span class="ic-t" title="Item de troca">${IC.swap}</span>`:""}${it.alerta?`<span class="ic-a" title="Alerta">${IC.alert}</span>`:""}</span>`:""}</button></td>`+ws.map(w=>{
      const cur=w.s<=T&&w.e>=T;
      if(w.e<ini)return `<td class="c ${cur?"cur":""}"><span class="pre" title="Antes do início do acompanhamento">–</span></td>`;
      const st=statusDe(it,w),m=mk(chave(it,w));
      const tit=st==="feita"?`${m.a==="troca"?"Trocado":m.a==="limpeza"?"Limpo":"Feito"} em ${fmtDH(m.t)} por ${nomeUid(m.u)}${m.o?". Obs: "+m.o:""}`:st==="pendente"?"Pendente":st==="vencida"?(adm?"Vencida":"Vencida, só administrador marca"):"Período ainda não começou";
      return `<td class="c ${cur?"cur":""}"><button class="cb ${st}" title="${esc(tit)}" aria-label="${esc(it.d)}, ${esc(w.label)}: ${esc(tit)}" ${st==="futura"?"disabled":""} onclick="onCheck('${it.id}','${w.id}')">${st==="feita"?IC.ck:st==="vencida"&&!adm?IC.lock:""}</button></td>`}).join("")+`</tr>`;
  });
  const mesSel=(p==="d"||p==="w")?`<label for="tbm">Mês</label><select id="tbm" onchange="ui.tabMes=Number(this.value);render()">${MESL.map((n,i)=>`<option value="${i}" ${i===ui.tabMes?"selected":""}>${n[0].toUpperCase()+n.slice(1)}</option>`).join("")}</select>`:"";
  const chips=`<div class="chips" role="group" aria-label="Periodicidade">${PKEYS.map(k=>`<button class="chip" aria-pressed="${p===k}" onclick="ui.filtro='${k}';render()">${PER[k].nome}</button>`).join("")}</div>`;
  app.innerHTML=topo("Itens do plano",pl.nome,'#/plano/'+C.pid)+`<div class="toolbar">${vistaHtml()}${adm?`<button class="linkbtn" onclick="location.hash='#/item/${C.pid}/novo'">${IC.mais}Adicionar item</button>`:""}</div>`+chips+
  `<div class="tbbar">${mesSel}<span class="muted" style="font-size:13px">${its.length} itens ${PER[p].plural}</span></div>
  <div class="leg"><span><i style="background:var(--g);border-color:var(--g)"></i>Feita</span><span><i style="background:var(--ysoft);border-color:var(--ybd)"></i>Pendente</span><span><i style="background:var(--rsoft);border-color:var(--red)"></i>Vencida</span><span><i style="border-color:var(--line)"></i>Ainda não começou</span></div>`+
  (its.length?`<div class="tbwrap" id="tbwrap"><table class="tb"><thead><tr><th class="nm">Atividade</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="alldone">Nenhum item nesta periodicidade.</div>`)+
  (adm?"":`<div class="lockmsg">${IC.lock}Itens vencidos só podem ser marcados por um administrador.</div>`);
  const wrap=document.getElementById("tbwrap"),cc=document.getElementById("colcur"),key=C.pid+p+ui.tabMes;
  if(wrap){if(key===tabKey)wrap.scrollLeft=tabScroll;else if(cc)wrap.scrollLeft=Math.max(0,cc.offsetLeft-wrap.clientWidth/2);wrap.onscroll=()=>{tabScroll=wrap.scrollLeft}}
  tabKey=key;
}
function telaLista(){
  const pl=P();if(!pl){app.innerHTML=semPlano("Itens");return}
  if(ui.vista==="tabela"){telaTabela();return}
  const R=calc(),f=ui.filtro,ps=PKEYS.filter(k=>f==="todas"||f===k),adm=souAdmin();
  let vh="",nv=0,body="";
  ps.forEach(k=>{const x=R[k];if(x.cur>0){const wd=x.ws[x.cur-1];x.its.forEach(it=>{const t=C.marks[chave(it,wd)];if(!t)nv++;if(!t||!ui.ocultar)vh+=itemHtml(it,wd,true)})}});
  if(vh)body+=`<section class="sec"><div class="sech bad"><h3>Vencidas</h3><span>${nv?nv+" sem registro":"todas regularizadas"}</span></div>${adm?"":`<div class="lockmsg">${IC.lock}Itens vencidos só podem ser marcados por um administrador.</div>`}${vh}</section>`;
  ps.forEach(k=>{
    const x=R[k],wd=x.ws[x.cur];if(!wd)return;
    const feitos=x.its.filter(it=>C.marks[chave(it,wd)]).length;
    let lista=x.its.slice().sort(ordArea);if(ui.ocultar)lista=lista.filter(it=>!C.marks[chave(it,wd)]);
    let inner="",g=null;lista.forEach(it=>{if(it.g!==g){g=it.g;inner+=`<div class="grp">${esc(g)}</div>`}inner+=itemHtml(it,wd,false)});
    if(!lista.length)inner=`<div class="alldone">${x.its.length?"Todos os itens deste período foram feitos.":"Nenhum item nesta periodicidade."}</div>`;
    body+=`<section class="sec"><div class="sech"><h3>${PER[k].nome}</h3><span>${k==="d"?"hoje, ":""}${wd.label}, ${feitos} de ${x.its.length} feitas</span></div>${inner}</section>`;
  });
  app.innerHTML=topo("Itens do plano",pl.nome,'#/plano/'+C.pid)+`<div class="toolbar">${vistaHtml()}${adm?`<button class="linkbtn" onclick="location.hash='#/item/${C.pid}/novo'">${IC.mais}Adicionar item</button>`:""}</div>`+chipsHtml(f)+
  `<div class="toolbar"><button class="toggle" aria-pressed="${ui.ocultar}" onclick="ui.ocultar=!ui.ocultar;render()"><span class="sw2"></span>Ocultar feitas</button></div>`+body;
}

    ${situ}

      <div class="f"><dt>Descrição</dt><dd>${it.desc?esc(it.desc):'<span class="muted">Sem descrição</span>'}</dd></div>
      <div class="f"><dt>Área</dt><dd>${esc(it.g)}</dd></div>

      <div class="f"><dt>Tempo estimado</dt><dd>${it.m?`${tot} min${it.u?`<small>${it.m} min × ${unidades()} unidades</small>`:""}`:'<span class="muted">Não informado</span>'}</dd></div>
      <div class="f"><dt>Tipo</dt><dd>${it.u?"Por unidade":"Único"}</dd></div>
